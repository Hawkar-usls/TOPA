name: sacred-scriptures-prescore-seal

on:
  push:
    branches:
      - topa-sacred-scriptures
    paths:
      - 'tools/sacred_scripture_source_seal.py'
      - 'tools/sacred_scripture_canaries.py'
      - 'research/sacred-scriptures/ANCIENT_WRITING_METHOD_BRIDGE.v0.2.json'
      - 'research/sacred-scriptures/PRESCORE_SOURCE_FREEZE.v0.2.json'
      - '.github/workflows/sacred-scriptures-prescore-seal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prescore-seal:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TOPA
        uses: actions/checkout@v4

      - name: Checkout exact BHSA source
        uses: actions/checkout@v4
        with:
          repository: ETCBC/bhsa
          ref: b112c16
          path: .source-cache/bhsa
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install source-seal dependencies
        run: python -m pip install --disable-pip-version-check text-fabric

      - name: Run four prescore canaries
        run: |
          python tools/sacred_scripture_canaries.py \
            --out receipts/CANARY_RUN.v0.1.json

      - name: Seal five immutable source loci
        run: |
          python tools/sacred_scripture_source_seal.py \
            --bhsa-dir .source-cache/bhsa \
            --out receipts/SOURCE_SEAL_RUN.v0.1.json

      - name: Verify combined permission gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('receipts/CANARY_RUN.v0.1.json').read_text())
          s=json.loads(Path('receipts/SOURCE_SEAL_RUN.v0.1.json').read_text())
          ok=(c['status']=='FOUR_OF_FOUR_PASS' and s['status']=='FIVE_OF_FIVE_SEALED')
          print(f"CANARIES={c['pass_count']}/4")
          print(f"SOURCES={s['sealed_count']}/5")
          print(f"BLIND_PACKET_BUILD_PERMISSION={str(ok).lower()}")
          print("SCORE_PERMISSION=false")
          if not ok:
              raise SystemExit(2)
          PY

      - name: Upload receipts only
        uses: actions/upload-artifact@v4
        with:
          name: sacred-scriptures-prescore-receipts
          path: receipts/*.json
          if-no-files-found: error
          retention-days: 90
