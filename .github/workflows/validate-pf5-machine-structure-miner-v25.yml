name: Validate PF5 Machine Structure Miner v25
on:
  push:
    branches: [pnp-spiral-hephaestus-crystal-v14]
  workflow_dispatch:
jobs:
  machine-structure-miner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile research/mathematics/p-vs-np/pf5_machine_structure_miner_v25.py
      - name: Run machine observer over frozen v24 survivors
        working-directory: research/mathematics/p-vs-np
        run: python pf5_machine_structure_miner_v25.py --json-out ../../../pf5-machine-structure-miner-v25.result.json
      - name: Verify observer-only contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-machine-structure-miner-v25.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-MACHINE-STRUCTURE-MINER-V25'
          assert d['status']=='POST_HOC_MACHINE_DISCOVERY_COMPLETE'
          assert d['role']=='OBSERVER_ONLY_NO_FORMULA_REWRITE'
          assert d['source_role']=='V24_FROZEN_OUTPUTS_ONLY'
          assert d['v24_result_sha256']=='865eb2de5fdc2c7ae0687f261304bfbafa36ac61cacdd0bcb14441dba1e8a8b9'
          assert d['v24_terminal_counts']=={'FALSE':3,'OPEN_RESIDUAL':11,'TRUE':18}
          assert d['open_residual_cases']==11
          assert d['modifies_formula'] is False
          assert d['uses_sat_oracle'] is False
          assert d['uses_truth_table'] is False
          assert d['uses_hephaestus_for_decision'] is False
          assert d['runtime_profiler_polynomial_in_explicit_residual_size'] is True
          assert d['admission_effect']=='NONE_POST_HOC_DISCOVERY_ONLY'
          assert d['fresh_holdout_required_before_lane_admission'] is True
          assert d['universal_exact_closure']=='OPEN'
          assert d['p_vs_np']=='OPEN'
          print('PF5_V25_OBSERVER_ONLY_CONTRACT = PASS')
          print('DOMINANT_ACTIONABLE_LANE =',d['dominant_actionable_lane'])
          print('NEXT_GATE =',d['next_gate'])
          print('RANKED_ACTIONABLE_FRONTIER =',d['ranked_actionable_frontier'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling
        run: |
          echo 'V25 = POST_HOC_MACHINE_DISCOVERY_ONLY'
          echo 'NO_LANE_ADMITTED_FROM_VIEWED_DATA'
          echo 'FRESH_V26_HOLDOUT_REQUIRED_BEFORE_PROVIDER'
          echo 'UNIVERSAL_EXACT_CLOSURE = OPEN'
          echo 'P_VS_NP = OPEN'
