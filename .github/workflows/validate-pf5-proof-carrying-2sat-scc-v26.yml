name: Validate PF5 Proof-Carrying 2-SAT SCC v26
on:
  push:
    branches: [pnp-spiral-hephaestus-crystal-v14]
  workflow_dispatch:
jobs:
  proof-carrying-2sat-scc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile research/mathematics/p-vs-np/pf5_proof_carrying_2sat_scc_v26.py
      - name: Run fresh frozen proof-carrying 2-SAT audit
        working-directory: research/mathematics/p-vs-np
        run: python pf5_proof_carrying_2sat_scc_v26.py --json-out ../../../pf5-proof-carrying-2sat-scc-v26.result.json
      - name: Verify frozen proof contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-proof-carrying-2sat-scc-v26.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-PROOF-CARRYING-2SAT-SCC-V26'
          assert d['status']=='FINITE_FRESH_BLIND_PROOF_CARRYING_2SAT_AUDIT_COMPLETE'
          assert d['feature']=='BIJUNCTIVE_2SAT_SCC'
          assert d['case_count']==32
          assert d['all_sources_frozen_before_provider'] is True
          assert d['all_v24_baselines_frozen_before_provider'] is True
          assert d['all_provider_outputs_frozen_before_semantic_audit'] is True
          assert d['holdout_not_conditioned_on_2sat_presence'] is True
          assert d['adaptive_extension_after_results'] is False
          assert d['uses_sat_oracle'] is False
          assert d['uses_truth_table_in_provider'] is False
          assert d['truth_table_used_only_after_provider_freeze_for_finite_audit'] is True
          assert d['uses_hephaestus_for_decision'] is False
          assert d['runtime_rule_polynomial_in_explicit_residual_size'] is True
          assert d['all_provider_proofs_verified'] is True
          assert d['all_terminal_semantic_audits_pass'] is True
          assert d['lane_admission_scope']=='2CNF_RESIDUALS_ONLY_IF_FRESH_AUDIT_PASSES'
          assert d['universal_exact_closure']=='OPEN'
          assert d['p_vs_np']=='OPEN'
          print('PF5_V26_FROZEN_PROOF_CONTRACT = PASS')
          print('SUMMARY =',d['summary'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling
        run: |
          echo '2SAT_SCC = RESTRICTED_PROOF_CARRYING_LANE_ONLY'
          echo 'FRESH_HOLDOUT = FROZEN_BEFORE_PROVIDER'
          echo 'NON_2CNF = OPEN_UNSUPPORTED'
          echo 'UNIVERSAL_EXACT_CLOSURE = OPEN'
          echo 'P_VS_NP = OPEN'
