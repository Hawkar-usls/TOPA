name: propaganda-kadesh-google-page-text-probe-v0-6

on:
  pull_request:
    branches:
      - topa-propaganda-defense
    paths:
      - 'tools/propaganda_kadesh_google_page_text_probe_v0_6.py'
      - '.github/workflows/propaganda-kadesh-google-page-text-probe-v0-6.yml'
      - 'research/propaganda-defense/**'

jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe Google full-view page-specific text representations
        run: python tools/propaganda_kadesh_google_page_text_probe_v0_6.py
      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kadesh-google-page-text-probe-v0-6
          path: research/propaganda-defense/execution/KADESH_GOOGLE_PAGE_TEXT_PROBE.v0.6.json
          if-no-files-found: error
          retention-days: 30
