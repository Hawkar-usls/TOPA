name: Validate PF5 Tautological-Resolvent Exact Projection v13.1

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/pf5_tautological_resolvent_projection_v13_1.py'
      - 'data/PF5-TRP-001-WITNESS-FREE-VARIABLE-DEFAULT.json'
      - '.github/workflows/validate-pf5-tautological-resolvent-projection-v13-1.yml'
  pull_request:
    paths:
      - 'research/mathematics/p-vs-np/pf5_tautological_resolvent_projection_v13_1.py'
      - 'data/PF5-TRP-001-WITNESS-FREE-VARIABLE-DEFAULT.json'
      - '.github/workflows/validate-pf5-tautological-resolvent-projection-v13-1.yml'

permissions:
  contents: read

jobs:
  exact-tautological-resolvent-projection-repaired-witness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile unchanged reducer and repaired adapter
        run: |
          python -m py_compile research/mathematics/p-vs-np/pf5_tautological_resolvent_projection_v13.py
          python -m py_compile research/mathematics/p-vs-np/pf5_tautological_resolvent_projection_v13_1.py
      - name: Run identical frozen v13 experiment through repaired witness adapter
        working-directory: research/mathematics/p-vs-np
        run: |
          python pf5_tautological_resolvent_projection_v13_1.py \
            --json-out ../../../pf5-tautological-resolvent-projection-v13-1.result.json
      - name: Verify repair scope and theorem-only contract
        run: |
          python - <<'PY'
          import inspect
          import json
          import sys
          sys.path.insert(0,'research/mathematics/p-vs-np')
          import pf5_tautological_resolvent_projection_v13 as v13
          import pf5_tautological_resolvent_projection_v13_1 as v131

          d=json.load(open('pf5-tautological-resolvent-projection-v13-1.result.json',encoding='utf-8'))
          defect=json.load(open('data/PF5-TRP-001-WITNESS-FREE-VARIABLE-DEFAULT.json',encoding='utf-8'))
          assert defect['source_run']==32835533447
          assert defect['source_job']==97763418763
          assert defect['blind_holdout_observed'] is False
          assert defect['scientific_result_produced'] is False
          assert defect['repair']['theorem_gate_unchanged'] is True
          assert defect['repair']['reducer_unchanged'] is True
          assert defect['repair']['candidate_or_score_logic_added'] is False

          assert d['artifact_id']=='PF5-TAUTOLOGICAL-RESOLVENT-EXACT-PROJECTION-V13'
          assert d['status']=='FINITE_BLIND_EXACT_PROJECTION_AUDIT_COMPLETE'
          assert d['new_feature']=='TAUTOLOGICAL_RESOLVENT_EXISTENTIAL_PROJECTION'
          assert d['new_feature_is_heuristic'] is False
          assert d['new_feature_uses_slime'] is False
          assert d['new_feature_uses_sat_oracle'] is False
          assert d['new_feature_uses_pswidth_score'] is False
          assert d['new_feature_uses_truth_table'] is False
          assert d['holdout_seeds_frozen_before_provider_run']==list(range(909000,909032))
          assert d['holdout_not_conditioned_on_feature_presence'] is True
          assert d['source_batch_frozen_before_reducer'] is True
          assert d['pure_only_batch_frozen_before_composed_reducer'] is True
          assert d['all_composed_reductions_frozen_before_exact_judges'] is True
          assert d['adaptive_seed_extension_after_results'] is False
          assert d['summary']['cases']==32
          assert d['summary']['all_semantic_projection_audits_pass'] is True
          assert d['runtime_rule_is_polynomial_in_explicit_residual_size'] is True
          assert d['witness_lift_is_replayable_from_certificate_given_residual_witness'] is True
          assert d['p_vs_np']=='OPEN'

          diag=d['diagnostic']
          assert diag['seed']==907003
          assert diag['pure_only_is_noop'] is True
          assert diag['semantic_audit_pass'] is True
          assert diag['composed_residual']==[]
          first=[x for x in diag['transcript'] if x['kind']=='TAUTOLOGICAL_RESOLVENT'][0]['certificate']
          assert first['variable']==1 and first['cross_pair_count']==4

          reducer_source=inspect.getsource(v13.discover_and_project_one)
          for token in ['pswidth','sat_oracle','truth_table','SlimeSemantic','score_candidate','exact_optimal']:
              assert token not in reducer_source, token
          repair_source=inspect.getsource(v131.repaired_lift_witness)
          assert 'discover_and_project_one' not in repair_source
          assert 'score' not in repair_source.lower()

          print('PF5_V13_1_REPAIR_SCOPE = PASS')
          print('PF5_V13_THEOREM_ONLY_RUNTIME_CONTRACT = PASS')
          print('SUMMARY =',d['summary'])
          print('SOURCE_BATCH_SHA256 =',d['source_batch_sha256'])
          print('PURE_ONLY_BATCH_SHA256 =',d['pure_only_batch_sha256'])
          print('COMPOSED_REDUCTION_BATCH_SHA256 =',d['composed_reduction_batch_sha256'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling
        run: |
          echo 'TAUTOLOGICAL_RESOLVENT_EXISTENTIAL_PROJECTION = EXACT'
          echo 'WITNESS_ADAPTER_REPAIR != NEW_SOLVER'
          echo 'FINITE_BLIND_REDUCTION != UNIVERSAL_COMPLETENESS'
          echo 'P_VS_NP = OPEN'
