name: Bootstrap TOPA provenance mirrors

on:
  push:
    paths:
      - ".github/workflows/bootstrap-topa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topa-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TOPA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream lineage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upstream
          mkdir -p .upstream
          git clone --depth 1 https://github.com/Hawkar-usls/janus-meta-registry.git .upstream/meta
          git clone --depth 1 https://github.com/Hawkar-usls/Janus_Genesis.git .upstream/genesis
          git clone --depth 1 https://github.com/Hawkar-usls/Janus-Demiurge.git .upstream/demiurge
          git clone --depth 1 https://github.com/Hawkar-usls/janus-distributed-ai-swarm.git .upstream/swarm
          git clone --depth 1 --single-branch --branch janus-tesla-sweep https://github.com/Hawkar-usls/Janus-Cosmos.git .upstream/cosmos

      - name: Refresh provenance mirrors without overwriting TOPA-native authority
        shell: bash
        run: |
          set -euo pipefail

          # IMPORTANT: protocols/, data/, docs/ and the TOPA-native strict router are
          # canonical TOPA state. They are intentionally NOT removed or overwritten.
          rm -rf \
            corpus/meta-registry \
            corpus/upstream-foundations \
            research/tesla-sweep \
            integrations/Janus-Demiurge/upstream \
            integrations/janus-distributed-ai-swarm/upstream

          mkdir -p \
            corpus/meta-registry \
            corpus/upstream-foundations \
            research/tesla-sweep \
            integrations/Janus-Demiurge/upstream \
            integrations/janus-distributed-ai-swarm/upstream \
            registry

          # Exact archival TOPA receipts/corpora.
          find .upstream/meta/data -maxdepth 1 -type f -name 'JANUS-TOPA-*.json' -print0 \
            | sort -z \
            | while IFS= read -r -d '' src; do cp "$src" corpus/meta-registry/; done

          # Upstream foundations are provenance mirrors only. They do NOT replace
          # protocols/TOPA_FOUNDATION.json or data/TOPA_STRICT_SCIENCE_GATE_V1_0.json.
          cp .upstream/genesis/.janus/TOPA_FOUNDATION.json \
            corpus/upstream-foundations/Janus_Genesis_TOPA_FOUNDATION.json

          if [[ -f .upstream/swarm/.janus/TOPA_FOUNDATION.json ]]; then
            cp .upstream/swarm/.janus/TOPA_FOUNDATION.json \
              integrations/janus-distributed-ai-swarm/upstream/TOPA_FOUNDATION.json
          fi
          cp .upstream/swarm/tools/topa_epistemic_router.py \
            integrations/janus-distributed-ai-swarm/upstream/topa_epistemic_router.py

          if [[ -f .upstream/demiurge/.janus/TOPA_FOUNDATION.json ]]; then
            cp .upstream/demiurge/.janus/TOPA_FOUNDATION.json \
              integrations/Janus-Demiurge/upstream/TOPA_FOUNDATION.json
          fi
          cp .upstream/demiurge/scout_swarm/orchestrator/TOPA_SCOUT_EPISTEMIC_PROTOCOL-v1.json \
            integrations/Janus-Demiurge/upstream/TOPA_SCOUT_EPISTEMIC_PROTOCOL-v1.json
          if [[ -f .upstream/demiurge/scout_swarm/SCOUT_SWARM_MANIFEST-v1.json ]]; then
            cp .upstream/demiurge/scout_swarm/SCOUT_SWARM_MANIFEST-v1.json \
              integrations/Janus-Demiurge/upstream/SCOUT_SWARM_MANIFEST-v1.json
          fi

          cp -a .upstream/cosmos/data/tesla-sweep/. research/tesla-sweep/

      - name: Validate TOPA-native strict science authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path('protocols/TOPA_FOUNDATION.json'),
              Path('data/TOPA_STRICT_SCIENCE_GATE_V1_0.json'),
              Path('integrations/janus-distributed-ai-swarm/topa_epistemic_router.py'),
              Path('research/mathematics/p-vs-np/C025_HIDDEN_EXPONENT_AUDIT_2026-08-24.md'),
          ]
          missing = [str(p) for p in required if not p.exists()]
          assert not missing, f'MISSING_TOPA_NATIVE_AUTHORITY={missing}'

          foundation = json.loads(Path('protocols/TOPA_FOUNDATION.json').read_text())
          gate = json.loads(Path('data/TOPA_STRICT_SCIENCE_GATE_V1_0.json').read_text())
          assert foundation['version'] == '1.3'
          assert foundation['id'] == 'JANUS_TOPA_FOUNDATION_V1_3_STRICT_SCIENCE'
          assert gate['id'] == 'TOPA_STRICT_SCIENCE_GATE_V1_0'
          assert gate['heuristic_quarantine']['active_evidence_graph'] == 'FORBIDDEN'
          print('TOPA_NATIVE_STRICT_SCIENCE_AUTHORITY=PASS')
          PY
          python integrations/janus-distributed-ai-swarm/topa_epistemic_router.py

      - name: Build deterministic provenance snapshot
        shell: bash
        run: |
          set -euo pipefail
          export META_SHA="$(git -C .upstream/meta rev-parse HEAD)"
          export GENESIS_SHA="$(git -C .upstream/genesis rev-parse HEAD)"
          export DEMIURGE_SHA="$(git -C .upstream/demiurge rev-parse HEAD)"
          export SWARM_SHA="$(git -C .upstream/swarm rev-parse HEAD)"
          export COSMOS_SHA="$(git -C .upstream/cosmos rev-parse HEAD)"

          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os
          from pathlib import Path

          managed_roots = [
              Path('corpus/meta-registry'),
              Path('corpus/upstream-foundations'),
              Path('research/tesla-sweep'),
              Path('integrations/Janus-Demiurge/upstream'),
              Path('integrations/janus-distributed-ai-swarm/upstream'),
          ]
          files = []
          for root in managed_roots:
              if not root.exists():
                  continue
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  raw = path.read_bytes()
                  files.append({
                      'path': path.as_posix(),
                      'bytes': len(raw),
                      'sha256': hashlib.sha256(raw).hexdigest(),
                  })

          snapshot = {
              'schema': 'janus.topa.upstream-snapshot.v2',
              'repository': 'Hawkar-usls/TOPA',
              'authority_rule': 'UPSTREAM_MIRROR_IS_PROVENANCE_NOT_TOPA_NATIVE_AUTHORITY',
              'topa_native_authority': {
                  'foundation': 'protocols/TOPA_FOUNDATION.json',
                  'strict_science_gate': 'data/TOPA_STRICT_SCIENCE_GATE_V1_0.json',
                  'router': 'integrations/janus-distributed-ai-swarm/topa_epistemic_router.py',
              },
              'sources': {
                  'janus-meta-registry': os.environ['META_SHA'],
                  'Janus_Genesis': os.environ['GENESIS_SHA'],
                  'Janus-Demiurge': os.environ['DEMIURGE_SHA'],
                  'janus-distributed-ai-swarm': os.environ['SWARM_SHA'],
                  'Janus-Cosmos-tesla-sweep': os.environ['COSMOS_SHA'],
              },
              'mirrored_files': files,
              'copy_is_independent_replication': False,
              'world_truth': False,
          }
          Path('registry/UPSTREAM-SNAPSHOT.json').write_text(
              json.dumps(snapshot, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          PY

      - name: Assert bootstrap cannot overwrite native authority
        shell: bash
        run: |
          set -euo pipefail
          git diff -- protocols/TOPA_FOUNDATION.json \
            data/TOPA_STRICT_SCIENCE_GATE_V1_0.json \
            integrations/janus-distributed-ai-swarm/topa_epistemic_router.py > /tmp/native.diff
          if [[ -s /tmp/native.diff ]]; then
            cat /tmp/native.diff
            echo 'BOOTSTRAP_ATTEMPTED_TO_MUTATE_TOPA_NATIVE_AUTHORITY' >&2
            exit 1
          fi
          echo 'BOOTSTRAP_NATIVE_AUTHORITY_IMMUTABILITY=PASS'

      - name: Commit refreshed provenance mirrors
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upstream
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            corpus/meta-registry \
            corpus/upstream-foundations \
            research/tesla-sweep \
            integrations/Janus-Demiurge/upstream \
            integrations/janus-distributed-ai-swarm/upstream \
            registry/UPSTREAM-SNAPSHOT.json
          if git diff --cached --quiet; then
            echo "TOPA provenance mirrors already current."
            exit 0
          fi
          git commit -m "Refresh TOPA provenance mirrors without authority overwrite"
          git push
