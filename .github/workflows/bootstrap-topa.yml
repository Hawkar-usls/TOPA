name: Bootstrap TOPA corpus

on:
  push:
    paths:
      - ".github/workflows/bootstrap-topa.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topa-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TOPA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate TOPA Habitat contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path('.janus/HABITAT_LINK.json'),
              Path('.janus/TOPA_NODE_MANIFEST.json'),
              Path('registry/ACCOUNT-WIDE-TOPA-MAP.json'),
              Path('registry/TOPA-AUDIT-STATE.json'),
          ]
          missing = [str(p) for p in required if not p.is_file()]
          if missing:
              raise SystemExit(f'Missing TOPA Habitat files: {missing}')

          habitat = json.loads(Path('.janus/HABITAT_LINK.json').read_text(encoding='utf-8'))
          if habitat.get('habitat_command_authority_granted') is not False:
              raise SystemExit('Habitat command authority must remain false')
          if habitat.get('write_back_default') != 'DENY':
              raise SystemExit('Habitat write-back default must remain DENY')
          if habitat.get('private_content_may_be_mirrored_to_public_habitat') is not False:
              raise SystemExit('Private-to-public mirroring must remain false')

          node = json.loads(Path('.janus/TOPA_NODE_MANIFEST.json').read_text(encoding='utf-8'))
          if node.get('world_truth_authority') is not False:
              raise SystemExit('TOPA world-truth authority must remain false')
          print('TOPA_HABITAT_CONTRACT=PASS')
          PY

      - name: Clone TOPA upstream lineage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upstream
          mkdir -p .upstream
          git clone --depth 1 https://github.com/Hawkar-usls/janus-meta-registry.git .upstream/meta
          git clone --depth 1 https://github.com/Hawkar-usls/Janus_Genesis.git .upstream/genesis
          git clone --depth 1 https://github.com/Hawkar-usls/Janus-Demiurge.git .upstream/demiurge
          git clone --depth 1 https://github.com/Hawkar-usls/janus-distributed-ai-swarm.git .upstream/swarm
          git clone --depth 1 --single-branch --branch janus-tesla-sweep https://github.com/Hawkar-usls/Janus-Cosmos.git .upstream/cosmos

      - name: Rebuild managed TOPA snapshot
        shell: bash
        run: |
          set -euo pipefail

          rm -rf corpus/meta-registry research/tesla-sweep protocols integrations/Janus-Demiurge integrations/janus-distributed-ai-swarm registry/TOPA-CORPUS-INDEX.json registry/UPSTREAM-SNAPSHOT.json

          mkdir -p \
            corpus/meta-registry \
            research/tesla-sweep \
            protocols \
            integrations/Janus-Demiurge \
            integrations/janus-distributed-ai-swarm \
            registry

          # Exact archival TOPA receipts/corpora.
          find .upstream/meta/data -maxdepth 1 -type f -name 'JANUS-TOPA-*.json' -print0 \
            | sort -z \
            | while IFS= read -r -d '' src; do cp "$src" corpus/meta-registry/; done

          # Canonical foundation (upstream exact snapshot takes precedence over local bootstrap copy).
          cp .upstream/genesis/.janus/TOPA_FOUNDATION.json protocols/TOPA_FOUNDATION.json

          # Distributed-swarm implementation and its local foundation snapshot.
          if [[ -f .upstream/swarm/.janus/TOPA_FOUNDATION.json ]]; then
            cp .upstream/swarm/.janus/TOPA_FOUNDATION.json integrations/janus-distributed-ai-swarm/TOPA_FOUNDATION.json
          fi
          cp .upstream/swarm/tools/topa_epistemic_router.py integrations/janus-distributed-ai-swarm/topa_epistemic_router.py

          # Demiurge / 17-Scout integration.
          if [[ -f .upstream/demiurge/.janus/TOPA_FOUNDATION.json ]]; then
            cp .upstream/demiurge/.janus/TOPA_FOUNDATION.json integrations/Janus-Demiurge/TOPA_FOUNDATION.json
          fi
          cp .upstream/demiurge/scout_swarm/orchestrator/TOPA_SCOUT_EPISTEMIC_PROTOCOL-v1.json integrations/Janus-Demiurge/TOPA_SCOUT_EPISTEMIC_PROTOCOL-v1.json
          if [[ -f .upstream/demiurge/scout_swarm/SCOUT_SWARM_MANIFEST-v1.json ]]; then
            cp .upstream/demiurge/scout_swarm/SCOUT_SWARM_MANIFEST-v1.json integrations/Janus-Demiurge/SCOUT_SWARM_MANIFEST-v1.json
          fi

          # Full dedicated Tesla Sweep/TOPA Hunt data tree from its research branch.
          cp -a .upstream/cosmos/data/tesla-sweep/. research/tesla-sweep/

      - name: Build deterministic provenance indexes
        shell: bash
        run: |
          set -euo pipefail
          META_SHA="$(git -C .upstream/meta rev-parse HEAD)"
          GENESIS_SHA="$(git -C .upstream/genesis rev-parse HEAD)"
          DEMIURGE_SHA="$(git -C .upstream/demiurge rev-parse HEAD)"
          SWARM_SHA="$(git -C .upstream/swarm rev-parse HEAD)"
          COSMOS_SHA="$(git -C .upstream/cosmos rev-parse HEAD)"

          export META_SHA GENESIS_SHA DEMIURGE_SHA SWARM_SHA COSMOS_SHA

          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          from pathlib import Path

          roots = [
              Path('.janus'),
              Path('protocols'),
              Path('corpus/meta-registry'),
              Path('research/tesla-sweep'),
              Path('integrations'),
              Path('registry'),
          ]

          source_map = {
              'protocols': {
                  'repository': 'Hawkar-usls/Janus_Genesis',
                  'branch': 'main',
                  'commit': os.environ['GENESIS_SHA'],
              },
              'corpus/meta-registry': {
                  'repository': 'Hawkar-usls/janus-meta-registry',
                  'branch': 'main',
                  'commit': os.environ['META_SHA'],
              },
              'research/tesla-sweep': {
                  'repository': 'Hawkar-usls/Janus-Cosmos',
                  'branch': 'janus-tesla-sweep',
                  'commit': os.environ['COSMOS_SHA'],
              },
              'integrations/Janus-Demiurge': {
                  'repository': 'Hawkar-usls/Janus-Demiurge',
                  'branch': 'main',
                  'commit': os.environ['DEMIURGE_SHA'],
              },
              'integrations/janus-distributed-ai-swarm': {
                  'repository': 'Hawkar-usls/janus-distributed-ai-swarm',
                  'branch': 'main',
                  'commit': os.environ['SWARM_SHA'],
              },
          }

          files = []
          for root in roots:
              if not root.exists():
                  continue
              for path in sorted(p for p in root.rglob('*') if p.is_file()):
                  raw = path.read_bytes()
                  rel = path.as_posix()
                  item = {
                      'path': rel,
                      'bytes': len(raw),
                      'sha256': hashlib.sha256(raw).hexdigest(),
                  }
                  for prefix, source in source_map.items():
                      if rel == prefix or rel.startswith(prefix + '/'):
                          item['source'] = source
                          break
                  if path.suffix.lower() == '.json':
                      try:
                          obj = json.loads(raw.decode('utf-8'))
                      except Exception:
                          obj = None
                      if isinstance(obj, dict):
                          for key in ('artifact_id', 'id', 'title', 'version', 'status', 'canonical_current'):
                              if key in obj:
                                  item[key] = obj[key]
                  files.append(item)

          counts = {}
          for item in files:
              top = item['path'].split('/', 1)[0]
              counts[top] = counts.get(top, 0) + 1

          index = {
              'schema': 'janus.topa.corpus-index.v1.1',
              'repository': 'Hawkar-usls/TOPA',
              'motto': 'NOTHING SUPERNATURAL — ONLY NATURE NOT YET UNDERSTOOD.',
              'file_count': len(files),
              'counts_by_top_level': counts,
              'files': files,
              'copy_is_independent_replication': False,
              'world_truth': False,
          }

          snapshot = {
              'schema': 'janus.topa.upstream-snapshot.v1.1',
              'repository': 'Hawkar-usls/TOPA',
              'sources': {
                  'janus-meta-registry': {
                      'repository': 'Hawkar-usls/janus-meta-registry',
                      'branch': 'main',
                      'commit': os.environ['META_SHA'],
                      'import': 'corpus/meta-registry/JANUS-TOPA-*.json',
                  },
                  'Janus_Genesis': {
                      'repository': 'Hawkar-usls/Janus_Genesis',
                      'branch': 'main',
                      'commit': os.environ['GENESIS_SHA'],
                      'import': 'protocols/TOPA_FOUNDATION.json',
                  },
                  'Janus-Demiurge': {
                      'repository': 'Hawkar-usls/Janus-Demiurge',
                      'branch': 'main',
                      'commit': os.environ['DEMIURGE_SHA'],
                      'import': 'integrations/Janus-Demiurge/',
                  },
                  'janus-distributed-ai-swarm': {
                      'repository': 'Hawkar-usls/janus-distributed-ai-swarm',
                      'branch': 'main',
                      'commit': os.environ['SWARM_SHA'],
                      'import': 'integrations/janus-distributed-ai-swarm/',
                  },
                  'Janus-Cosmos-tesla-sweep': {
                      'repository': 'Hawkar-usls/Janus-Cosmos',
                      'branch': 'janus-tesla-sweep',
                      'commit': os.environ['COSMOS_SHA'],
                      'import': 'research/tesla-sweep/',
                  },
              },
              'local_habitat_and_method_integrations_are_topa_authored': True,
              'copy_is_independent_replication': False,
              'world_truth': False,
          }

          Path('registry/TOPA-CORPUS-INDEX.json').write_text(
              json.dumps(index, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          Path('registry/UPSTREAM-SNAPSHOT.json').write_text(
              json.dumps(snapshot, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          PY

      - name: Validate imported TOPA router
        run: python integrations/janus-distributed-ai-swarm/topa_epistemic_router.py

      - name: Commit consolidated snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .upstream
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .janus protocols corpus research integrations registry
          if git diff --cached --quiet; then
            echo "TOPA snapshot already current."
            exit 0
          fi
          git commit -m "Import complete TOPA corpus from JANUS lineage"
          git push
