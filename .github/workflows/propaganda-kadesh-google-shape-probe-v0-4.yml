name: propaganda-kadesh-google-shape-probe-v0-4

on:
  pull_request:
    branches:
      - topa-propaganda-defense
    paths:
      - 'tools/propaganda_kadesh_google_shape_probe_v0_4.py'
      - '.github/workflows/propaganda-kadesh-google-shape-probe-v0-4.yml'
      - 'research/propaganda-defense/**'

jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Map Google Books result shape without persisting snippets
        run: python tools/propaganda_kadesh_google_shape_probe_v0_4.py
      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kadesh-google-shape-probe-v0-4
          path: research/propaganda-defense/execution/KADESH_GOOGLE_SHAPE_PROBE.v0.4.json
          if-no-files-found: error
          retention-days: 30
