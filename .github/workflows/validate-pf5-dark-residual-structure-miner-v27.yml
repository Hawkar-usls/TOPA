name: Validate PF5 Dark Residual Structure Miner v27
on:
  push:
    branches: [pnp-spiral-hephaestus-crystal-v14]
  workflow_dispatch:
jobs:
  dark-residual-structure-miner:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile research/mathematics/p-vs-np/pf5_dark_residual_structure_miner_v27.py
      - name: Run dark residual observer
        working-directory: research/mathematics/p-vs-np
        run: python pf5_dark_residual_structure_miner_v27.py --json-out ../../../pf5-dark-residual-structure-miner-v27.result.json
      - name: Verify observer contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-dark-residual-structure-miner-v27.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-DARK-RESIDUAL-STRUCTURE-MINER-V27'
          assert d['status']=='POST_HOC_DARK_RESIDUAL_MACHINE_DISCOVERY_COMPLETE'
          assert d['role']=='OBSERVER_ONLY_NO_SOURCE_SAT_DECISION'
          assert d['source_v26_result_sha256']=='b3b1d9361bc109ccc1454fa38f0f7fd87439b5db4f31a790f4391206b80ae498'
          assert d['dark_residual_count']==9
          assert d['k_max_frozen_before_observation']==2
          assert d['modifies_dark_residual'] is False
          assert d['uses_sat_oracle'] is False
          assert d['uses_truth_table'] is False
          assert d['renamable_class_recognition_uses_proof_carrying_v26_2sat'] is True
          assert d['fresh_holdout_required_before_lane_admission'] is True
          assert d['universal_exact_closure']=='OPEN'
          assert d['p_vs_np']=='OPEN'
          print('PF5_V27_DARK_OBSERVER_CONTRACT = PASS')
          print('RANKED_ACTIONABLE_FRONTIER =',d['ranked_actionable_frontier'])
          print('DOMINANT_ACTIONABLE_LANE =',d['dominant_actionable_lane'])
          print('NEXT_GATE =',d['next_gate'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling
        run: |
          echo 'V27 = POST_HOC_DARK_RESIDUAL_DISCOVERY_ONLY'
          echo 'K_MAX = 2 FROZEN BEFORE OBSERVATION'
          echo 'NO_SOURCE_SAT_DECISION'
          echo 'FRESH_V28_REQUIRED_BEFORE_ADMISSION'
          echo 'P_VS_NP = OPEN'
