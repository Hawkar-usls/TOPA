name: propaganda-kadesh-hathi-scan-probe-v0-5

on:
  pull_request:
    branches:
      - topa-propaganda-defense
    paths:
      - 'tools/propaganda_kadesh_hathi_scan_probe_v0_5.py'
      - '.github/workflows/propaganda-kadesh-hathi-scan-probe-v0-5.yml'
      - 'research/propaganda-defense/**'

jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe bounded Hathi full-view scan window
        run: python tools/propaganda_kadesh_hathi_scan_probe_v0_5.py
      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kadesh-hathi-scan-probe-v0-5
          path: research/propaganda-defense/execution/KADESH_HATHI_SCAN_PROBE.v0.5.json
          if-no-files-found: error
          retention-days: 30
