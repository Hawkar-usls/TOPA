name: Validate Akinator RSPC Structured KC Barrier

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/C025_AKINATOR_RSPC_STRUCTURED_KC_BARRIER.md'
      - 'research/mathematics/p-vs-np/akinator_rspc_structured_kc_probe.py'
      - '.github/workflows/validate-akinator-rspc-structured-kc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-mechanics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run structured-KC finite mechanics
        run: python research/mathematics/p-vs-np/akinator_rspc_structured_kc_probe.py
      - name: Claim ceiling reminder
        run: |
          echo 'CI checks only bounded-degree monotone 2-CNF/B2 encoding mechanics on small fixtures.'
          echo 'Expander linear treewidth is analytical graph theory.'
          echo 'd-SDNNF/SDD exponential lower bound and structured d-DNNF negation barrier are external theorems.'
          echo 'No universal Akinator impossibility theorem is claimed.'
          echo 'P_VS_NP = OPEN'
