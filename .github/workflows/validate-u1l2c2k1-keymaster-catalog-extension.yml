name: Validate U1-L2C2K1 Keymaster Catalog Extension

on:
  push:
    branches:
      - pnp-proof-obligation-graph-u1-l2-exact-only
    paths:
      - 'research/mathematics/p-vs-np/u1l2c2k1_keymaster_catalog_extension_verifier.py'
      - '.github/workflows/validate-u1l2c2k1-keymaster-catalog-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-keymaster-extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile extension verifier
        run: python -m py_compile research/mathematics/p-vs-np/u1l2c2k1_keymaster_catalog_extension_verifier.py
      - name: Verify exact catalog extension and compositions
        run: python research/mathematics/p-vs-np/u1l2c2k1_keymaster_catalog_extension_verifier.py
