name: Validate PF5 JANUS Action Graph v29
on:
  push:
    branches: [pnp-spiral-hephaestus-crystal-v14]
  workflow_dispatch:
jobs:
  janus-action-graph:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile research/mathematics/p-vs-np/pf5_janus_action_graph_v29.py
      - name: Run observer on authoritative v28 survivors
        working-directory: research/mathematics/p-vs-np
        run: python pf5_janus_action_graph_v29.py --json-out ../../../pf5-janus-action-graph-v29.result.json
      - name: Verify observer contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-janus-action-graph-v29.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-JANUS-ACTION-GRAPH-V29'
          assert d['status']=='POST_HOC_V28_SURVIVOR_MACHINE_POLICY_DISCOVERY_COMPLETE'
          assert d['role']=='OBSERVER_ONLY_NO_NEW_SOURCE_SAT_AUTHORITY'
          assert d['source_v28_result_sha256']=='830103432809de48e5b3bc268e397060501e65fc2b4d18bbb92c5691f1939328'
          assert d['survivor_count']==4
          assert d['max_policy_depth_frozen_before_observation']==2
          assert d['uses_sat_oracle'] is False
          assert d['uses_truth_table'] is False
          assert d['modifies_authoritative_v28_survivors'] is False
          assert d['component_decomposition_theorem_reused'] is True
          assert d['universal_fixed_depth_policy_exists']=='OPEN'
          assert d['universal_exact_closure']=='OPEN'
          assert d['p_vs_np']=='OPEN'
          print('PF5_V29_JANUS_ACTION_GRAPH_CONTRACT = PASS')
          print('RANKED_COMPLETE_ACTION_FRONTIER =',d['ranked_complete_action_frontier'])
          print('RANKED_REDUCTION_SIGNAL_FRONTIER =',d['ranked_reduction_signal_frontier'])
          print('DOMINANT_COMPLETE_LANE =',d['dominant_complete_lane'])
          print('NEXT_GATE =',d['next_gate'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling
        run: |
          echo 'V29 = POST_HOC OBSERVER ONLY'
          echo 'MAX_ADAPTIVE_POLICY_DEPTH = 2 FIXED'
          echo 'NO_SAT_ORACLE = TRUE'
          echo 'NO_TRUTH_TABLE = TRUE'
          echo 'FRESH_V30_REQUIRED_BEFORE_NEW_LANE_ADMISSION'
          echo 'UNIVERSAL_FIXED_DEPTH_POLICY = OPEN'
          echo 'P_VS_NP = OPEN'
