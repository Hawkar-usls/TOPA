name: Validate JANUS RCTQ-3 Reverse Forward

on:
  push:
    branches:
      - pnp-proof-obligation-graph-u1-l2-exact-only
    paths:
      - 'research/mathematics/p-vs-np/rctq3_reverse_forward_gauge_normalization_verifier.py'
      - '.github/workflows/validate-janus-rctq3-reverse-forward.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reverse-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile reverse-forward verifier
        run: python -m py_compile research/mathematics/p-vs-np/rctq3_reverse_forward_gauge_normalization_verifier.py
      - name: Execute reverse-forward exact replay
        run: python research/mathematics/p-vs-np/rctq3_reverse_forward_gauge_normalization_verifier.py
