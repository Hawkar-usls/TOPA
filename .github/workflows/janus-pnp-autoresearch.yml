name: TOPA JANUS P-vs-NP Autoresearch Spider

on:
  push:
    branches: [main]
    paths:
      - 'tools/janus_pnp_autoresearch.py'
      - 'tools/topa_pnp_drive_bridge.py'
      - 'tools/topa_pnp_corpus_bridge.py'
      - 'config/JANUS_PNP_CORPUS_FABRIC.json'
      - 'config/P_VS_NP_MATERIALS_INDEX_FALLBACK.json'
      - 'protocols/JANUS_PNP_AUTORESEARCH_PROTOCOL_v1.0.json'
      - 'protocols/JANUS_PNP_AUTORESEARCH_PROTOCOL_v1.1.json'
      - 'registry/JANUS-PNP-CORPUS-FABRIC-BINDING-v1.0.json'
      - '.github/workflows/janus-pnp-autoresearch.yml'
  schedule:
    - cron: '27 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topa-janus-pnp-autoresearch
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Self-test TOPA research tools and corpus fabric
        run: |
          set -euo pipefail
          python tools/topa_arxiv_gateway.py self-test
          python tools/topa_spider.py self-test
          python tools/topa_pnp_drive_bridge.py self-test
          python tools/topa_pnp_corpus_bridge.py self-test

      - name: Recover previous isolated PNP corpus state
        run: |
          set -euo pipefail
          rm -rf /tmp/pnp-prev
          mkdir -p /tmp/pnp-prev
          if git ls-remote --exit-code --heads origin janus/pnp-autoresearch-state >/dev/null 2>&1; then
            git fetch origin janus/pnp-autoresearch-state
            for F in CORPUS.json CORPUS_WEIGHT_LEDGER.json; do
              git show "origin/janus/pnp-autoresearch-state:data/pnp-autoresearch/$F" > "/tmp/pnp-prev/$F" 2>/dev/null || true
            done
          fi

      - name: Resolve private Google Drive corpus index or pinned fallback
        env:
          JANUS_GDRIVE_APP_ID: ${{ secrets.JANUS_GDRIVE_APP_ID }}
          JANUS_GDRIVE_APP_CRED: ${{ secrets.JANUS_GDRIVE_APP_CRED }}
          JANUS_GDRIVE_RENEWAL: ${{ secrets.JANUS_GDRIVE_RENEWAL }}
        run: |
          set -euo pipefail
          rm -rf /tmp/pnp-corpus
          mkdir -p /tmp/pnp-corpus
          python tools/topa_pnp_drive_bridge.py fetch-index \
            --file-id 1lL5lftT64eojjeNcd0RqvS9XpCFyaqE9 \
            --fallback config/P_VS_NP_MATERIALS_INDEX_FALLBACK.json \
            --out /tmp/pnp-corpus/MATERIALS_INDEX.json \
            --receipt /tmp/pnp-corpus/DRIVE_INDEX_RECEIPT.json

      - name: Prefer Meta Registry corpus when Drive is degraded
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/pnp-corpus/DRIVE_INDEX_RECEIPT.json').read_text())
          Path('/tmp/pnp-corpus/NEED_META').write_text('0' if r.get('source')=='GOOGLE_DRIVE_PRIVATE_OAUTH' else '1')
          PY
          if [ "$(cat /tmp/pnp-corpus/NEED_META)" = "1" ]; then
            META_URL="https://raw.githubusercontent.com/Hawkar-usls/janus-meta-registry/integration/pnp-corpus-fabric-v1/registry/p_vs_np/corpus/P_VS_NP_MATERIALS_INDEX_META_FALLBACK.json"
            if curl -fsSL --retry 2 --connect-timeout 15 "$META_URL" -o /tmp/pnp-corpus/META_INDEX.json; then
              python - <<'PY'
              import hashlib, json
              from pathlib import Path
              p=Path('/tmp/pnp-corpus/META_INDEX.json')
              x=json.loads(p.read_text(encoding='utf-8-sig'))
              a=x.get('scientific_authority') or {}
              assert x.get('schema')=='JANUS_P_VS_NP_MATERIALS_INDEX'
              assert a.get('P_VS_NP')=='OPEN'
              assert a.get('D1')=='EMPTY'
              assert a.get('SUCCESSOR_ALGORITHM')=='LOCKED'
              target=Path('/tmp/pnp-corpus/MATERIALS_INDEX.json')
              target.write_bytes(p.read_bytes())
              receipt=Path('/tmp/pnp-corpus/DRIVE_INDEX_RECEIPT.json')
              r=json.loads(receipt.read_text())
              previous={'status':r.get('status'),'source':r.get('source'),'output_sha256':r.get('output_sha256')}
              r.update({
                'status':'META_REGISTRY_FALLBACK_ACTIVE',
                'source':'JANUS_META_REGISTRY_JSON_CORPUS',
                'meta_registry_url':'https://raw.githubusercontent.com/Hawkar-usls/janus-meta-registry/integration/pnp-corpus-fabric-v1/registry/p_vs_np/corpus/P_VS_NP_MATERIALS_INDEX_META_FALLBACK.json',
                'previous_fallback_receipt':previous,
                'output_sha256':hashlib.sha256(target.read_bytes()).hexdigest(),
                'meta_registry_is_scientific_authority':False,
                'drive_unavailable_is_scientific_evidence':False
              })
              receipt.write_text(json.dumps(r,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
              print('TOPA_PNP_META_REGISTRY_FALLBACK=PASS')
              PY
            else
              echo "TOPA_PNP_META_REGISTRY_FALLBACK=UNAVAILABLE__LOCAL_PINNED_FALLBACK_RETAINED"
            fi
          else
            echo "TOPA_PNP_META_REGISTRY_FALLBACK=NOT_NEEDED__LIVE_DRIVE"
          fi

      - name: Run bounded internet research cycle
        run: |
          set -euo pipefail
          rm -rf /tmp/pnp-autoresearch
          python tools/janus_pnp_autoresearch.py \
            --out /tmp/pnp-autoresearch \
            --max-queries 6 \
            --per-source 12 \
            --corpus-index /tmp/pnp-corpus/MATERIALS_INDEX.json
          python tools/topa_pnp_corpus_bridge.py build \
            --index /tmp/pnp-corpus/MATERIALS_INDEX.json \
            --discoveries /tmp/pnp-autoresearch/source-records.jsonl \
            --previous-corpus /tmp/pnp-prev/CORPUS.json \
            --previous-ledger /tmp/pnp-prev/CORPUS_WEIGHT_LEDGER.json \
            --out-corpus /tmp/pnp-autoresearch/CORPUS.json \
            --out-ledger /tmp/pnp-autoresearch/CORPUS_WEIGHT_LEDGER.json \
            --receipt /tmp/pnp-autoresearch/DEDUPE_RECEIPT.json
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/pnp-autoresearch/LATEST.json').read_text())
          assert x['schema']=='janus.topa.pnp_autoresearch_cycle.v1'
          assert x['authority']['truth'] is False
          assert x['authority']['proof'] is False
          assert x['authority']['fundamentum_mutation'] is False
          assert x['query_seed_count'] > 0
          c=json.load(open('/tmp/pnp-autoresearch/CORPUS.json'))
          w=json.load(open('/tmp/pnp-autoresearch/CORPUS_WEIGHT_LEDGER.json'))
          d=json.load(open('/tmp/pnp-autoresearch/DEDUPE_RECEIPT.json'))
          assert c['schema']=='janus.topa.pnp_corpus.v1'
          assert c['P_VS_NP']=='OPEN'
          assert c['successor_algorithm']=='LOCKED'
          assert c['authority']['truth'] is False
          assert w['authority']['weights_are_truth'] is False
          assert w['authority']['source_documents_immutable'] is True
          assert d['near_semantic_duplicate_policy']=='FLAG_ONLY__DO_NOT_AUTO_MERGE'
          print('TOPA_PNP_AUTORESEARCH_GATE=PASS')
          print('TOPA_PNP_CORPUS_FABRIC=PASS')
          PY
      - name: Publish deduplicated corpus and weight sidecar to private Drive when authorized
        env:
          JANUS_GDRIVE_APP_ID: ${{ secrets.JANUS_GDRIVE_APP_ID }}
          JANUS_GDRIVE_APP_CRED: ${{ secrets.JANUS_GDRIVE_APP_CRED }}
          JANUS_GDRIVE_RENEWAL: ${{ secrets.JANUS_GDRIVE_RENEWAL }}
        run: |
          set -euo pipefail
          python tools/topa_pnp_drive_bridge.py publish \
            --input /tmp/pnp-autoresearch/CORPUS.json \
            --folder-id 1JPo-GtCtIO6yMDIsOvB9RTCDdZMNFDAk \
            --name TOPA_PNP_CORPUS_LATEST.json \
            --mime-type application/json \
            --receipt /tmp/pnp-autoresearch/DRIVE_CORPUS_PUBLISH_RECEIPT.json
          python tools/topa_pnp_drive_bridge.py publish \
            --input /tmp/pnp-autoresearch/CORPUS_WEIGHT_LEDGER.json \
            --folder-id 1IwRcwQ9VCvku8P4AKJd2TkKiG1CU4b2F \
            --name TOPA_PNP_WEIGHT_LEDGER.json \
            --mime-type application/json \
            --receipt /tmp/pnp-autoresearch/DRIVE_WEIGHT_PUBLISH_RECEIPT.json
          python tools/topa_pnp_drive_bridge.py publish \
            --input /tmp/pnp-autoresearch/DEDUPE_RECEIPT.json \
            --folder-id 1JPo-GtCtIO6yMDIsOvB9RTCDdZMNFDAk \
            --name TOPA_PNP_DEDUPE_RECEIPT.json \
            --mime-type application/json \
            --receipt /tmp/pnp-autoresearch/DRIVE_DEDUPE_PUBLISH_RECEIPT.json

      - name: Persist isolated TOPA research state
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin janus/pnp-autoresearch-state >/dev/null 2>&1; then
            git fetch origin janus/pnp-autoresearch-state
            git switch -C janus/pnp-autoresearch-state origin/janus/pnp-autoresearch-state
          else
            git switch --orphan janus/pnp-autoresearch-state
            git rm -rf . >/dev/null 2>&1 || true
          fi
          mkdir -p data/pnp-autoresearch/history
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          cp /tmp/pnp-autoresearch/LATEST.json data/pnp-autoresearch/LATEST.json
          cp /tmp/pnp-autoresearch/spider-receipt.json data/pnp-autoresearch/spider-receipt.json
          cp /tmp/pnp-autoresearch/spider-nodes.jsonl data/pnp-autoresearch/spider-nodes.jsonl
          cp /tmp/pnp-autoresearch/spider-edges.jsonl data/pnp-autoresearch/spider-edges.jsonl
          cp /tmp/pnp-autoresearch/source-records.jsonl data/pnp-autoresearch/source-records.jsonl
          cp /tmp/pnp-autoresearch/CORPUS.json data/pnp-autoresearch/CORPUS.json
          cp /tmp/pnp-autoresearch/CORPUS_WEIGHT_LEDGER.json data/pnp-autoresearch/CORPUS_WEIGHT_LEDGER.json
          cp /tmp/pnp-autoresearch/DEDUPE_RECEIPT.json data/pnp-autoresearch/DEDUPE_RECEIPT.json
          cp /tmp/pnp-corpus/MATERIALS_INDEX.json data/pnp-autoresearch/MATERIALS_INDEX_SNAPSHOT.json
          cp /tmp/pnp-corpus/DRIVE_INDEX_RECEIPT.json data/pnp-autoresearch/DRIVE_INDEX_RECEIPT.json
          cp /tmp/pnp-autoresearch/DRIVE_CORPUS_PUBLISH_RECEIPT.json data/pnp-autoresearch/DRIVE_CORPUS_PUBLISH_RECEIPT.json
          cp /tmp/pnp-autoresearch/DRIVE_WEIGHT_PUBLISH_RECEIPT.json data/pnp-autoresearch/DRIVE_WEIGHT_PUBLISH_RECEIPT.json
          cp /tmp/pnp-autoresearch/DRIVE_DEDUPE_PUBLISH_RECEIPT.json data/pnp-autoresearch/DRIVE_DEDUPE_PUBLISH_RECEIPT.json
          cp /tmp/pnp-autoresearch/LATEST.json "data/pnp-autoresearch/history/${stamp}.json"
          git config user.name 'janus-topa-spider[bot]'
          git config user.email 'janus-topa-spider[bot]@users.noreply.github.com'
          git add data/pnp-autoresearch
          git diff --cached --quiet && exit 0
          git commit -m "topa: autonomous P-vs-NP research cycle ${stamp}"
          git push origin HEAD:janus/pnp-autoresearch-state
