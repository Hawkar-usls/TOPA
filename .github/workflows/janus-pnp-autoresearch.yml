name: TOPA JANUS P-vs-NP Autoresearch Spider

on:
  push:
    branches: [main]
    paths:
      - 'tools/janus_pnp_autoresearch_fast.py'
      - '.github/workflows/janus-pnp-autoresearch.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topa-janus-pnp-autoresearch
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify resilient autoresearch kernel
        run: |
          set -euo pipefail
          python -m py_compile tools/janus_pnp_autoresearch_fast.py

      - name: Recover prior corpus
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/pnp-prior-source-records.jsonl
          git fetch origin janus/pnp-autoresearch-state || true
          if git rev-parse --verify origin/janus/pnp-autoresearch-state >/dev/null 2>&1; then
            for REV in $(git rev-list --max-count=20 origin/janus/pnp-autoresearch-state); do
              if git show "$REV:data/pnp-autoresearch/source-records.jsonl" > /tmp/pnp-prior-candidate.jsonl 2>/dev/null && [ -s /tmp/pnp-prior-candidate.jsonl ]; then
                cp /tmp/pnp-prior-candidate.jsonl /tmp/pnp-prior-source-records.jsonl
                echo "TOPA_PNP_PRIOR_CORPUS_REV=$REV"
                break
              fi
            done
          fi
          echo "TOPA_PNP_PRIOR_RECORDS=$(awk 'NF{n++} END{print n+0}' /tmp/pnp-prior-source-records.jsonl)"

      - name: Run adaptive internet research cycle
        run: |
          set -euo pipefail
          rm -rf /tmp/pnp-autoresearch
          python tools/janus_pnp_autoresearch_fast.py \
            --out /tmp/pnp-autoresearch \
            --prior-records /tmp/pnp-prior-source-records.jsonl \
            --max-queries 6 \
            --per-source 10

          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('/tmp/pnp-autoresearch/LATEST.json').read_text())
          assert x['schema']=='janus.topa.pnp_autoresearch_cycle.v3'
          assert x['authority']['truth'] is False
          assert x['authority']['proof'] is False
          assert x['authority']['fundamentum_mutation'] is False
          assert x['record_count'] >= x['prior_record_count']
          assert x['query_seed_count'] > 0
          print('TOPA_PNP_AUTORESEARCH_STATUS=' + x['status'])
          print('TOPA_PNP_AUTORESEARCH_ACTIVE=' + str(x['autoreserch_active']))
          print('TOPA_PNP_PRIOR=' + str(x['prior_record_count']))
          print('TOPA_PNP_RETRIEVED=' + str(x['retrieved_cycle_record_count']))
          print('TOPA_PNP_NOVEL=' + str(x['novel_cycle_record_count']))
          print('TOPA_PNP_CORPUS=' + str(x['record_count']))
          print('TOPA_PNP_SOURCE_HEALTH=' + json.dumps(x['source_health'],sort_keys=True))
          PY

      - name: Persist isolated TOPA research state
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin janus/pnp-autoresearch-state >/dev/null 2>&1; then
            git fetch origin janus/pnp-autoresearch-state
            git switch -C janus/pnp-autoresearch-state origin/janus/pnp-autoresearch-state
          else
            git switch --orphan janus/pnp-autoresearch-state
            git rm -rf . >/dev/null 2>&1 || true
          fi

          mkdir -p data/pnp-autoresearch/history
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          cp /tmp/pnp-autoresearch/LATEST.json data/pnp-autoresearch/LATEST.json
          cp /tmp/pnp-autoresearch/spider-receipt.json data/pnp-autoresearch/spider-receipt.json
          cp /tmp/pnp-autoresearch/spider-nodes.jsonl data/pnp-autoresearch/spider-nodes.jsonl
          cp /tmp/pnp-autoresearch/spider-edges.jsonl data/pnp-autoresearch/spider-edges.jsonl
          cp /tmp/pnp-autoresearch/source-records.jsonl data/pnp-autoresearch/source-records.jsonl
          cp /tmp/pnp-autoresearch/LATEST.json "data/pnp-autoresearch/history/${stamp}.json"

          git config user.name 'janus-topa-spider[bot]'
          git config user.email 'janus-topa-spider[bot]@users.noreply.github.com'
          git add data/pnp-autoresearch
          if git diff --cached --quiet; then
            echo 'TOPA_PNP_AUTORESEARCH_NO_STATE_CHANGE'
            exit 0
          fi
          git commit -m "topa: autonomous P-vs-NP research cycle ${stamp}"
          git push origin HEAD:janus/pnp-autoresearch-state
