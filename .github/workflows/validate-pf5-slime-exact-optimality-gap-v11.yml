name: Validate PF5 Slime Exact Optimality Gap v11

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/pf5_slime_exact_optimality_gap_v11.py'
      - '.github/workflows/validate-pf5-slime-exact-optimality-gap-v11.yml'
  pull_request:
    paths:
      - 'research/mathematics/p-vs-np/pf5_slime_exact_optimality_gap_v11.py'
      - '.github/workflows/validate-pf5-slime-exact-optimality-gap-v11.yml'

permissions:
  contents: read

jobs:
  exact-optimality-gap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TOPA
        uses: actions/checkout@v4
        with:
          path: topa
      - name: Checkout pinned Slime producer
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: 36437e053bb151660eaed4e82634d430346343a5
          path: demiurge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen exact-optimum audit
        working-directory: topa/research/mathematics/p-vs-np
        run: |
          python pf5_slime_exact_optimality_gap_v11.py \
            --producer-path ../../../../demiurge/models/slime/slime_semantic_candidate_router.py \
            --json-out ../../../../pf5-slime-exact-optimality-gap-v11.result.json
      - name: Verify exact-judge firewall
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-slime-exact-optimality-gap-v11.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-SLIME-EXACT-OPTIMALITY-GAP-V11'
          assert d['status']=='FINITE_EXACT_OPTIMUM_AUDIT_COMPLETE'
          assert d['frozen_seeds_before_provider_run']==list(range(907000,907016))
          assert d['variable_count']==5 and d['clause_count']==7
          assert d['all_sources_and_manifests_frozen_before_exact_dp'] is True
          assert d['adaptive_candidate_generation_after_exact_dp'] is False
          assert d['exact_dp_is_exponential_audit_oracle_not_runtime_algorithm'] is True
          assert d['summary']['cases']==16
          assert d['summary']['slime_optimal']+d['summary']['slime_suboptimal']==16
          assert d['universal_candidate_completeness']=='OPEN'
          assert d['p_vs_np']=='OPEN'
          for row in d['all_rows']:
              assert row['exact_optimal_caterpillar_ps_width'] <= min(row['candidate_widths'].values())
              assert row['slime_optimality_gap'] == row['slime_width']-row['exact_optimal_caterpillar_ps_width']
          print('PF5_SLIME_EXACT_OPTIMALITY_V11_CONTRACT = PASS')
          print('SUMMARY =',d['summary'])
          print('MANIFEST_BATCH_SHA256 =',d['manifest_batch_sha256'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling
        run: |
          echo 'SLIME_SUBOPTIMAL != SAT_HARDNESS'
          echo 'EXACT_SMALL_OPTIMUM != POLYNOMIAL_DISCOVERY'
          echo 'FINITE_OPTIMALITY != UNIVERSAL_COMPLETENESS'
          echo 'P_VS_NP = OPEN'
