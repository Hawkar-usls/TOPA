name: sacred-scriptures-pre-coder-gate

on:
  push:
    branches:
      - topa-sacred-scriptures
    paths:
      - 'research/sacred-scriptures/DOUBLE_CODING_REVERSE_SPIRAL.v0.1.json'
      - 'research/sacred-scriptures/CODER_INDEPENDENCE_CONTRACT.v0.1.json'
      - 'research/sacred-scriptures/ARBITRATION_PROTOCOL.v0.1.json'
      - 'research/sacred-scriptures/SOURCE_CODING_PACKET_TEMPLATE.v0.1.json'
      - 'tools/sacred_scripture_pre_coder_gate.py'
      - '.github/workflows/sacred-scriptures-pre-coder-gate.yml'
  pull_request:
    branches:
      - topa-sacred-scriptures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pre-coder-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout authority branch
        uses: actions/checkout@v4
        with:
          ref: topa-sacred-scriptures

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run reverse-spiral pre-coder gate
        run: python tools/sacred_scripture_pre_coder_gate.py

      - name: Upload gate receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sacred-scriptures-pre-coder-gate
          path: research/sacred-scriptures/execution/PRE_CODER_CONTRACT_FREEZE_GATE.v0.1.json
          if-no-files-found: warn
          retention-days: 90

      - name: Persist gate receipt to authority branch
        if: success() && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/sacred-scriptures/execution/PRE_CODER_CONTRACT_FREEZE_GATE.v0.1.json
          git diff --cached --quiet || git commit -m "Record sacred-scriptures pre-coder reverse-spiral gate receipt"
          git push origin HEAD:topa-sacred-scriptures

      - name: Enforce score lock
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/sacred-scriptures/execution/PRE_CODER_CONTRACT_FREEZE_GATE.v0.1.json')
          if not p.exists():
              raise SystemExit('gate receipt missing')
          g=json.loads(p.read_text(encoding='utf-8'))
          if g.get('semantic_coding_permission') is not True:
              raise SystemExit(2)
          if g.get('score_permission') is not False:
              raise SystemExit('score must remain locked')
          if g.get('same_reasoning_instance_may_count_as_two_coders') is not False:
              raise SystemExit('independence contract violated')
          PY
