name: Validate PF5 Continuation Refinement Certificate v16.1

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/PF5_CONTINUATION_REFINEMENT_CERTIFICATE_V16_1.md'
      - 'research/mathematics/p-vs-np/pf5_continuation_refinement_certificate_v16_1.py'
      - '.github/workflows/validate-pf5-continuation-refinement-certificate-v16-1.yml'
  pull_request:
    paths:
      - 'research/mathematics/p-vs-np/PF5_CONTINUATION_REFINEMENT_CERTIFICATE_V16_1.md'
      - 'research/mathematics/p-vs-np/pf5_continuation_refinement_certificate_v16_1.py'
      - '.github/workflows/validate-pf5-continuation-refinement-certificate-v16-1.yml'

permissions:
  contents: read

jobs:
  continuation-refinement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TOPA
        uses: actions/checkout@v4
        with:
          path: topa
      - name: Checkout pinned Slime v5.1 producer
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: e507484a62eb29543910cd018c380150051f986f
          path: demiurge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run continuation refinement audit
        working-directory: topa/research/mathematics/p-vs-np
        run: |
          python pf5_continuation_refinement_certificate_v16_1.py \
            --producer-path ../../../../demiurge/models/slime/slime_semantic_candidate_router_v5_1.py \
            --json-out ../../../../pf5-continuation-refinement-v16-1.result.json
      - name: Verify refinement/certificate firewall
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-continuation-refinement-v16-1.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-CONTINUATION-REFINEMENT-CERTIFICATE-V16.1'
          assert d['status']=='FINITE_CONTINUATION_REFINEMENT_AUDIT_COMPLETE'
          assert d['seed']==911000 and d['posthoc_not_holdout'] is True
          assert d['raw_subset_state_count']==4096
          assert d['initial_partition']['class_count']==71
          assert d['final_partition']['matches_v16_future_bisimulation'] is True
          assert d['final_partition']['class_count']==d['final_partition']['v16_bisimulation_class_count']
          assert d['quotient_bellman_value']==4
          assert d['quotient_lifted_width']==4
          assert d['split_certificate_count']>0
          assert all(r['monotone_refinement'] for r in d['refinement_rounds'])
          c=d['conditional_theorem']
          assert c['explicit_refinement_is_sound_on_finite_prefix_DAG'] is True
          assert c['fixed_point_is_future_congruence'] is True
          assert c['quotient_bellman_and_concrete_lift_are_exact'] is True
          assert c['polynomial_if_symbolic_blocks_splits_transitions_and_certificates_are_polynomially_bounded'] is True
          assert c['universal_polynomial_symbolic_refinement_exists']=='OPEN'
          e=d['epistemic_firewall']
          assert e['raw_prefix_enumeration_is_exponential_audit_only'] is True
          assert e['exact_ps_table_is_exponential_audit_only'] is True
          assert e['exact_v16_bisimulation_is_used_only_as_independent_final_partition_oracle'] is True
          assert e['split_witnesses_use_only_prior_partition_successor_blocks'] is True
          assert e['no_merge_is_authorized_by_similarity'] is True
          assert e['no_claim_of_polynomial_split_discovery'] is True
          assert d['universal_polynomial_prefix_quotient']=='OPEN'
          assert d['p_vs_np']=='OPEN'
          print('PF5_CONTINUATION_REFINEMENT_V16_1_CONTRACT = PASS')
          print('INITIAL_CLASSES =',d['initial_partition']['class_count'])
          print('ROUND_COUNTS =',[(r['round'],r['old_class_count'],r['new_class_count'],r['split_block_count']) for r in d['refinement_rounds']])
          print('FINAL_CLASSES =',d['final_partition']['class_count'])
          print('SPLIT_CERTIFICATES =',d['split_certificate_count'])
          print('SPLIT_CERT_BYTES =',d['split_certificate_bytes'])
          print('GLOBAL_COST_LEDGER =',d['global_cost_ledger'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling
        run: |
          echo 'EXPLICIT_PREFIX_REFINEMENT = EXPONENTIAL AUDIT ONLY'
          echo 'SPLIT_CERTIFICATE_SOUNDNESS != POLYNOMIAL SPLIT DISCOVERY'
          echo 'FINITE_FIXED_POINT != UNIVERSAL POLYNOMIAL QUOTIENT'
          echo 'P_VS_NP = OPEN'
