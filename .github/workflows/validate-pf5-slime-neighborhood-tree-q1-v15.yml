name: Validate PF5 Slime Neighborhood Tree q1 v15

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/PF5_SLIME_NEIGHBORHOOD_TREE_Q1_V15.md'
      - 'research/mathematics/p-vs-np/pf5_slime_neighborhood_tree_q1_v15.py'
      - '.github/workflows/validate-pf5-slime-neighborhood-tree-q1-v15.yml'
  pull_request:
    paths:
      - 'research/mathematics/p-vs-np/PF5_SLIME_NEIGHBORHOOD_TREE_Q1_V15.md'
      - 'research/mathematics/p-vs-np/pf5_slime_neighborhood_tree_q1_v15.py'
      - '.github/workflows/validate-pf5-slime-neighborhood-tree-q1-v15.yml'

permissions:
  contents: read

jobs:
  neighborhood-tree-q1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TOPA
        uses: actions/checkout@v4
        with:
          path: topa
      - name: Checkout pinned neighborhood-tree producer
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: 5a2ce5175049b59869c95d801b394f36ffdd3a4e
          path: demiurge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run fresh frozen neighborhood-tree q1 probe
        working-directory: topa/research/mathematics/p-vs-np
        run: |
          python pf5_slime_neighborhood_tree_q1_v15.py \
            --producer-path ../../../../demiurge/models/slime/slime_neighborhood_cluster_tree_v5.py \
            --json-out ../../../../pf5-slime-neighborhood-tree-q1-v15.result.json
      - name: Verify outcome-neutral runtime and receipts
        run: |
          python - <<'PY'
          import inspect,json,sys
          sys.path.insert(0,'topa/research/mathematics/p-vs-np')
          import pf5_slime_neighborhood_tree_q1_v15 as v15
          import pf5_slime_balanced_branch_q1_v14 as v14
          import pf5_slime_capped_pswidth_compiler_v12 as v12

          d=json.load(open('pf5-slime-neighborhood-tree-q1-v15.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-SLIME-NEIGHBORHOOD-TREE-Q1-V15'
          assert d['status']=='FINITE_SOURCE_DRIVEN_TREE_PROBE_COMPLETE'
          assert d['producer']['commit']=='5a2ce5175049b59869c95d801b394f36ffdd3a4e'
          assert d['q']==1
          assert d['frozen_rows']==[list(x) for x in v15.FROZEN_ROWS]
          assert d['all_formulas_and_tree_manifests_frozen_before_compilation'] is True
          assert d['runtime_assignment_enumeration'] is False
          assert d['runtime_exact_width_oracle'] is False
          assert d['runtime_sat_oracle'] is False
          assert len(d['results'])==12
          assert d['closed_candidates']+d['open_candidates']==12*5
          assert d['global_ledger']['candidate_attempts']==12*5
          assert d['arbitrary_binary_tree_q1_completeness']=='OPEN'
          assert d['some_fixed_q_completeness']=='OPEN'
          assert d['p_vs_np']=='OPEN'

          source=inspect.getsource(v15.compile_portfolio)
          for token in ['score_candidate(', 'assignment_signatures(', 'solve_sat(', 'sat_oracle(']:
              assert token not in source, token

          recovered=0
          for row in d['results']:
              p=row['portfolio']
              assert p['cap']==row['incidence_leaves']
              assert p['closed_candidates']+p['open_candidates']==5
              formula=v12.random_connected_3cnf(row['seed'],row['n'],row['m'])
              for attempt in p['attempts']:
                  if attempt['terminal']=='OPEN_NEIGHBORHOOD_STATE_CAP':
                      assert attempt['failure']['distinct_states_at_refusal']==attempt['failure']['cap']+1
                  else:
                      assert attempt['terminal']=='CLOSED_NEIGHBORHOOD_PSWIDTH_CAP'
                      assert attempt['peak_ps_state']<=p['cap']
                      assert attempt['certificate_replayed_before_discard'] is True
              if p['terminal']=='CLOSED_NEIGHBORHOOD_PORTFOLIO_Q1':
                  recovered+=1
                  wrapped={'terminal':'CLOSED_BALANCED_PSWIDTH_CAP','certificate':p['selected_certificate']}
                  assert v14.replay_balanced_certificate(formula,wrapped)
                  assert p['selected_certificate_replay'] is True
              else:
                  assert p['terminal']=='OPEN_NEIGHBORHOOD_PORTFOLIO_Q1_EXHAUSTED'
                  assert p['closed_candidates']==0 and p['open_candidates']==5
          assert recovered==d['recovered_sources']
          assert d['exhausted_sources']==12-recovered
          if recovered:
              assert d['terminal_interpretation']=='SOURCE_DRIVEN_NONCONTIGUOUS_TREE_RECOVERS_Q1_ON_FINITE_CONTROL'
          else:
              assert d['terminal_interpretation']=='CURRENT_FIVE_NEIGHBORHOOD_TREE_HEURISTICS_Q1_EXHAUSTED_ON_FRESH_DENSE_LADDER'
          print('PF5_V15_OUTCOME_NEUTRAL_CONTRACT = PASS')
          print('RECOVERED_SOURCES =',d['recovered_sources'])
          print('EXHAUSTED_SOURCES =',d['exhausted_sources'])
          print('CLOSED_CANDIDATES =',d['closed_candidates'])
          print('OPEN_CANDIDATES =',d['open_candidates'])
          print('SELECTED_COUNTS =',d['selected_candidate_counts'])
          print('BATCH_SHA256 =',d['frozen_batch_sha256'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling reminder
        run: |
          echo 'NEIGHBORHOOD_TREE_RECOVERY != UNIVERSAL_Q1_COMPLETENESS'
          echo 'FIVE_HEURISTIC_FAILURE != ARBITRARY_BRANCH_TREE_LOWER_BOUND'
          echo 'NO_Q_ESCALATION'
          echo 'P_VS_NP = OPEN'
