name: Validate Akinator RSPC Witness Frontier

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/C025_AKINATOR_RSPC_WITNESS_FRONTIER_DICHOTOMY.md'
      - 'research/mathematics/p-vs-np/akinator_rspc_witness_frontier_probe.py'
      - '.github/workflows/validate-akinator-rspc-witness-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-mechanics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run witness-frontier finite mechanics
        run: python research/mathematics/p-vs-np/akinator_rspc_witness_frontier_probe.py
      - name: Claim ceiling reminder
        run: |
          echo 'CI checks finite parity-point compatibility and symbolic-intersection fixtures only.'
          echo 'The 2^(n-1) frontier theorem is an analytical counting argument.'
          echo 'NP-completeness of symbolic intersection is an analytical reduction.'
          echo 'No universal restricted-selector lower bound is claimed.'
          echo 'P_VS_NP = OPEN'
