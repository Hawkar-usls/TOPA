name: Validate JANUS RCTQ-2 Reverse Forward

on:
  push:
    branches:
      - pnp-proof-obligation-graph-u1-l2-exact-only
    paths:
      - 'data/JANUS-PNP-RCTQ2-REVERSE-FORWARD-AUDIT-2026-08-25-v1.0.json'
      - 'research/mathematics/p-vs-np/rctq2_reverse_forward_audit_verifier.py'
      - '.github/workflows/validate-janus-rctq2-reverse-forward.yml'
      - 'research/mathematics/p-vs-np/rctq2_frozen_catalog_escape_verifier.py'
      - 'research/mathematics/p-vs-np/rctq1_restriction_closed_transition_quotient_verifier.py'
      - 'research/mathematics/p-vs-np/janus_kanami_spiral_atlas_verifier.py'
      - 'research/mathematics/p-vs-np/janus_exact_reverse_spiral_unified_runner.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reverse-forward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile RCTQ-2 reverse-forward verifier
        run: python -m py_compile research/mathematics/p-vs-np/rctq2_reverse_forward_audit_verifier.py
      - name: Execute RCTQ-2 reverse-forward exact replay
        run: python research/mathematics/p-vs-np/rctq2_reverse_forward_audit_verifier.py
