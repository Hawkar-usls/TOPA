name: propaganda-kadesh-archived-url-variant-probe-v0-17

on:
  pull_request:
    branches:
      - topa-propaganda-defense
    paths:
      - 'tools/propaganda_kadesh_archived_url_variant_probe_v0_17.py'
      - '.github/workflows/propaganda-kadesh-archived-url-variant-probe-v0-17.yml'
      - 'research/propaganda-defense/**'

jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe archived URL variants for frozen Scribd document IDs
        run: python tools/propaganda_kadesh_archived_url_variant_probe_v0_17.py
      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kadesh-archived-url-variant-probe-v0-17
          path: research/propaganda-defense/execution/KADESH_ARCHIVED_URL_VARIANT_PROBE.v0.17.json
          if-no-files-found: error
          retention-days: 30
