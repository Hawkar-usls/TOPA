name: Validate PF5 Slime Pseudoforest Gap Microscope v14.1

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/pf5_slime_pseudoforest_gap_microscope_v14_1.py'
      - '.github/workflows/validate-pf5-slime-pseudoforest-gap-microscope-v14-1.yml'
  pull_request:
    paths:
      - 'research/mathematics/p-vs-np/pf5_slime_pseudoforest_gap_microscope_v14_1.py'
      - '.github/workflows/validate-pf5-slime-pseudoforest-gap-microscope-v14-1.yml'

permissions:
  contents: read

jobs:
  v4-residual-gap-microscope:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TOPA
        uses: actions/checkout@v4
        with:
          path: topa
      - name: Checkout pinned Slime v4 producer
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: 321421130fd7a0ffe53c20bdf648f1a9673e4ce4
          path: demiurge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Diagnose already-observed v14 seed 910000
        working-directory: topa/research/mathematics/p-vs-np
        run: |
          python pf5_slime_pseudoforest_gap_microscope_v14_1.py \
            --producer-path ../../../../demiurge/models/slime/slime_semantic_candidate_router_v4.py \
            --json-out ../../../../pf5-slime-pseudoforest-gap-microscope-v14-1.result.json
      - name: Verify post-hoc scope
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-slime-pseudoforest-gap-microscope-v14-1.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-SLIME-PSEUDOFOREST-GAP-MICROSCOPE-V14.1'
          assert d['status']=='POSTHOC_DIAGNOSTIC_COMPLETE'
          assert d['seed']==910000 and d['posthoc_not_holdout'] is True
          assert d['v4_width']==6 and d['exact_optimal_width']==4
          assert d['optimality_gap']==2
          assert d['next_feature_or_search_rule_must_be_source_only'] is True
          assert d['arbitrary_relation_graph_counting_admitted'] is False
          assert d['p_vs_np']=='OPEN'
          print('PF5_SLIME_PSEUDOFOREST_GAP_V14_1_CONTRACT = PASS')
          print('FIRST_EXACT_LOCAL_GAP =',d['first_exact_local_gap'])
          print('FIRST_PSEUDOFOREST_CAP_TIE_FAILURE =',d['first_pseudoforest_cap_tie_failure'])
          print('DIAGNOSTIC_SPLIT =',d['diagnostic_split'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling
        run: |
          echo 'POSTHOC_DIAGNOSTIC != BLIND_HOLDOUT'
          echo 'PSEUDOFOREST_GAP != HARDNESS'
          echo 'P_VS_NP = OPEN'
