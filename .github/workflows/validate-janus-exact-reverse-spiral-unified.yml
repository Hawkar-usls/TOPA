name: Validate JANUS Exact Reverse Spiral Unified

on:
  push:
    branches:
      - pnp-proof-obligation-graph-u1-l2-exact-only
    paths:
      - 'research/mathematics/p-vs-np/janus_exact_reverse_spiral_unified_runner.py'
      - '.github/workflows/validate-janus-exact-reverse-spiral-unified.yml'
      - 'data/JANUS-PNP-REVERSE-SPIRAL-METHOD-UNIFICATION-2026-08-25-v1.0.json'
      - 'research/mathematics/p-vs-np/u1l2c2k_keymaster_exact_algebra_verifier.py'
      - 'research/mathematics/p-vs-np/u1l2c2c1_swap_orbit_weight_quotient_verifier.py'
      - 'research/mathematics/p-vs-np/u1l2c2k1_keymaster_catalog_extension_verifier.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-reverse-spiral:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile unified exact runner
        run: python -m py_compile research/mathematics/p-vs-np/janus_exact_reverse_spiral_unified_runner.py
      - name: Run unified exact JANUS reverse spiral
        run: python research/mathematics/p-vs-np/janus_exact_reverse_spiral_unified_runner.py
