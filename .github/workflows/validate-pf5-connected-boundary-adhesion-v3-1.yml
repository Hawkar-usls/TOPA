name: Validate PF5 Connected Boundary Adhesion v3.1

on:
  push:
    branches:
      - pf5-connected-boundary-adhesion-v3
  pull_request:
    paths:
      - 'research/mathematics/p-vs-np/PF5_CONNECTED_BOUNDARY_ADHESION_V3_1_AFFINE_WING_REPAIR.md'
      - 'research/mathematics/p-vs-np/pf5_connected_boundary_adhesion_v3_1.py'
      - '.github/workflows/validate-pf5-connected-boundary-adhesion-v3-1.yml'

jobs:
  affine-wing-adhesion:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run frozen affine-wing adhesion replay
        working-directory: research/mathematics/p-vs-np
        run: |
          python pf5_connected_boundary_adhesion_v3_1.py --json-out ../../../pf5-connected-boundary-adhesion-v3.1.result.json

      - name: Verify ADH-001 repair contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-connected-boundary-adhesion-v3.1.result.json', encoding='utf-8'))
          assert d['artifact_id']=='PF5-CONNECTED-BOUNDARY-ADHESION-V3.1-AFFINE-WING'
          assert d['repair_of']=='ADH-001-OBDD-WING-BOTTLENECK'
          assert d['widths_frozen_before_v3_provider_run']==[2,4,6,8,10,12,14]
          assert d['widths_changed_from_v3'] is False
          assert d['caps_changed_from_v3'] is False
          assert d['boundary_language_changed_from_v3'] is False
          assert d['inner_representation']=='AFFINE_GF2'
          assert d['join_operator']=='J_B(Lambda,Rho)=Lambda_INTERSECT_Rho'
          assert d['claim_ceiling']=='P_VS_NP = OPEN'
          assert len(d['controls'])==14
          passed=0
          for r in d['controls']:
              assert r['connected'] is True
              assert r['inner_representation']=='AFFINE_GF2'
              if r['status']=='PASS_EXACT_CLOSED':
                  passed += 1
                  expect=1 << (r['k']-1)
                  assert r['left_boundary_rows']==expect
                  assert r['right_boundary_rows']==expect
                  assert r['private_projection_exact'] is True
                  assert r['boundary_relations_exact'] is True
                  assert r['adhesion_join_exact'] is True
                  assert r['repeated_boundary_project_exact'] is True
                  assert r['strict_witness_glue_exact'] is True
                  assert r['explicit_table_exponential_footprint_observed'] is True
                  if r['expected_sat']:
                      assert r['join_rows']==expect
                      assert r['final_scalar'] is True
                      assert r['witness_valid'] is True
                      assert r['witness_source']=='JOIN_ROW_PLUS_ACTUAL_AFFINE_PIVOT_PROOFS'
                  else:
                      assert r['join_rows']==0
                      assert r['final_scalar'] is False
                      assert r['witness_valid'] is None
                      assert r['witness_source']=='NO_WITNESS_UNSAT_JOIN_EMPTY'
              else:
                  assert r['status']=='CAP_HIT'
          assert passed > 4, 'repair should get strictly beyond the original k<=4 pass region'
          assert d['all_passed_controls_exact'] is True
          assert d['explicit_table_exponential_footprint_observed'] is True
          assert d['adh001_repaired_if_first_cap_moves_past_private_projection'] is True
          if d['first_base_cap_hit'] is not None:
              assert d['first_base_cap_hit']['phase'] != 'PRIVATE_PROJECTION'
          assert d['representation_lower_bound']=='NOT_ESTABLISHED'
          assert d['universal_o_log_n_adhesion_bound']=='OPEN'
          assert d['cheap_compact_boundary_discovery']=='OPEN'
          assert d['compressed_boundary_rewrite_discovery']=='OPEN'
          assert d['global_progress_amortization']=='OPEN'
          assert d['p_vs_np']=='OPEN'
          print('PF5_ADH_001_AFFINE_WING_REPAIR = PASS')
          print('PASSED_CONTROLS =', passed)
          print('FIRST_BASE_CAP_HIT =', d['first_base_cap_hit'])
          print('RESULT_SHA256 =', d['result_sha256'])
          PY

      - name: Claim ceiling reminder
        run: |
          echo 'ADH-001 repair isolates separator cost without raising caps.'
          echo 'Explicit table escape is not a lower bound against compressed boundary languages.'
          echo 'UNIVERSAL_O_LOG_N_ADHESION_BOUND = OPEN'
          echo 'CHEAP_COMPACT_BOUNDARY_DISCOVERY = OPEN'
          echo 'P_VS_NP = OPEN'
