name: propaganda-kadesh-cc-query-audit-v0-18

on:
  pull_request:
    branches:
      - topa-propaganda-defense
    paths:
      - 'tools/propaganda_kadesh_cc_query_audit_v0_18.py'
      - '.github/workflows/propaganda-kadesh-cc-query-audit-v0-18.yml'
      - 'research/propaganda-defense/**'

jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reverse-audit Common Crawl query semantics and historical sampling
        run: python tools/propaganda_kadesh_cc_query_audit_v0_18.py
      - name: Upload diagnostic receipt
        uses: actions/upload-artifact@v4
        with:
          name: kadesh-cc-query-audit-v0-18
          path: research/propaganda-defense/execution/KADESH_CC_QUERY_AUDIT.v0.18.json
          if-no-files-found: error
          retention-days: 30
