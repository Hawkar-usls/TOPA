name: JANUS TOPA JWST Strict-Science Training Gate

on:
  pull_request:
    paths:
      - 'research/astronomy/JWST_MOCSS_HUDF_SINGLE_LINE_TOPA_2026-10-16.json'
      - 'research/astronomy/JWST_MOCSS_HUDF_MAST_SPATIAL_TOPA_2026-10-16.json'
      - 'research/astronomy/MOCSS_16_EXPOSURE_GEOMETRY_TRAINING_2026-10-16.json'
      - 'research/astronomy/MOCSS_16_EXPOSURE_SKY_WCS_RATE_TRAINING_2026-10-16.json'
      - '.github/workflows/jwst-mocss-topa-training.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  topa-evidence-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate source, controls, and training contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('research/astronomy/JWST_MOCSS_HUDF_SINGLE_LINE_TOPA_2026-10-16.json')
          x = json.loads(p.read_text(encoding='utf-8'))
          assert x['raw_social_claim']['provenance_channel'] == 'HEARSAY_REPORT'
          assert x['status'] == 'SOURCE_BOUND_FACT_WITH_UNRESOLVED_PHYSICAL_IDENTITY'
          assert x['world_truth'] is False
          assert x['training_policy']['direct_gradient_training_eligible'] is False
          assert x['training_policy']['automatic_claim_promotion'] is False
          assert len(x['source_bound_claims']) >= 6
          assert len(x['alternative_hypotheses']) >= 4
          assert len(x['training_examples']) >= 6
          assert all(y['status'] == 'HYPOTHESIS_ONLY' for y in x['alternative_hypotheses'])
          assert x['reporting_audit']['status'] == 'OPEN_REQUIRES_METHOD_MATCH'
          assert x['epistemic_gates'][2]['status'] == 'INSUFFICIENT_DATA'
          assert x['epistemic_gates'][4]['status'] == 'UNRESOLVED'

          y = json.loads(Path('research/astronomy/MOCSS_16_EXPOSURE_GEOMETRY_TRAINING_2026-10-16.json').read_text())
          assert y['world_truth'] is False
          gates = y['new_receipt_gates']
          assert gates['archive_16_long_exposures_identified'] == 'PASS'
          assert gates['detector_32_primary_headers_inspected'] == 'PASS'
          assert gates['msa_16_ids_confirmed_in_two_original_archive_tables'] == 'PASS'
          assert gates['actual_OIII_4960_line_detection'] == 'NOT_PERFORMED'
          assert gates['all_16_full_rate_sci_arrays_reduced'] == 'NOT_PERFORMED'
          assert gates['independent_16004_A_line_redetection'] == 'NOT_PERFORMED'
          assert gates['independent_spatial_extent'] == 'NOT_PERFORMED'
          assert gates['source_identity'] == 'UNRESOLVED'
          assert len(y['physics_observations']) >= 4
          assert len(y['training_antipatterns']) >= 5
          assert y['policy']['proof_before_promotion']
          assert y['policy']['do_not_train_model_weights_from_single_receipt']
          print('PASS: source-bound TOPA training and 16-exposure MSA association gates')
          print('INDEPENDENT_MAST_HEADER_AND_MSA_REPLAY=VERIFIED')
          print('INDEPENDENT_SPECTRAL_SKY_MAP=NOT_EXECUTED')
          print('SOURCE_IDENTITY=UNRESOLVED')

          z = json.loads(Path('research/astronomy/MOCSS_16_EXPOSURE_SKY_WCS_RATE_TRAINING_2026-10-16.json').read_text())
          assert z['world_truth'] is False
          assert z['promotion_status'] == 'RESEARCH_ONLY_NOT_AUTOMATIC_MODEL_TRAINING'
          a = z['independent_replay']
          assert a['original_rate_files'] == 32 and a['exposures'] == 16
          assert a['independent_sky_registration_done'] is True
          assert a['calibrated_flux_limits_done'] is False
          assert a['physical_extent_measured'] is False
          assert a['source_identification'] == 'unknown'
          assert z['hypothesis_line_windows_angstrom']['OIII_4960_if_5008_primary'] == 15850.7933
          assert z['sky_field']['distance_of_emission_path'] is None
          assert z['sky_field']['direction_of_physical_propagation'] is None
          assert len(z['guarded_training_cases']) >= 5
          assert 'NO_FORMAL_SIGNIFICANCE_FROM_UNCALIBRATED_RATE_CONTRAST' in z['release_gates']
          print('INDEPENDENT_32_RATE_WCS_SKY_PROJECTION=RESEARCH_RECEIPT')
          print('CALIBRATED_SPECTRAL_LINE_LIMITS=NOT_AVAILABLE')
          print('MODEL_WEIGHTS_UNCHANGED=true')
          PY
