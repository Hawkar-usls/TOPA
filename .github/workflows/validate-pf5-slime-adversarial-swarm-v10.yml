name: Validate PF5 Slime Adversarial Swarm v10

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/PF5_SLIME_ADVERSARIAL_SWARM_V10.md'
      - 'research/mathematics/p-vs-np/pf5_slime_adversarial_swarm_v10.py'
      - '.github/workflows/validate-pf5-slime-adversarial-swarm-v10.yml'
  pull_request:
    paths:
      - 'research/mathematics/p-vs-np/PF5_SLIME_ADVERSARIAL_SWARM_V10.md'
      - 'research/mathematics/p-vs-np/pf5_slime_adversarial_swarm_v10.py'
      - '.github/workflows/validate-pf5-slime-adversarial-swarm-v10.yml'

permissions:
  contents: read

jobs:
  adversarial-fixed-swarm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TOPA
        uses: actions/checkout@v4
        with:
          path: topa
      - name: Checkout pinned Slime producer
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: 36437e053bb151660eaed4e82634d430346343a5
          path: demiurge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen adversarial swarm probe
        working-directory: topa/research/mathematics/p-vs-np
        run: |
          python pf5_slime_adversarial_swarm_v10.py \
            --producer-path ../../../../demiurge/models/slime/slime_semantic_candidate_router.py \
            --json-out ../../../../pf5-slime-adversarial-swarm-v10.result.json
      - name: Verify v10 phase discipline without asserting Slime outcome
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-slime-adversarial-swarm-v10.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-SLIME-ADVERSARIAL-SWARM-V10'
          assert d['status']=='FINITE_ADVERSARIAL_PROBE_COMPLETE'
          assert d['source_seeds_frozen_before_provider_run']==list(range(906500,906532))
          assert d['challengers_per_source']==32
          assert d['challenger_generation_uses_exact_score'] is False
          assert d['all_33_orders_per_source_frozen_before_exact_probe'] is True
          assert len(d['results'])==32
          assert sum(d['outcome_counts_vs_best_random'].values())==32
          assert d['exact_probe_is_finite_exponential_audit_only'] is True
          assert d['universal_candidate_completeness']=='OPEN'
          assert d['p_vs_np']=='OPEN'
          # Deliberately no assertion that Slime wins or loses.
          for row in d['results']:
              assert len(row['all_random_widths'])==32
              assert 1 <= row['slime_tie_aware_rank_among_33'] <= 33
          print('PF5_SLIME_ADVERSARIAL_SWARM_V10_CONTRACT = PASS')
          print('OUTCOMES =', d['outcome_counts_vs_best_random'])
          print('ESCAPES =', d['sources_with_random_escape'])
          print('MAXIMUM_LOSS_RATIO =', d['maximum_loss_ratio'])
          print('FROZEN_BATCH_SHA256 =', d['frozen_candidate_batch_sha256'])
          print('RESULT_SHA256 =', d['result_sha256'])
          PY
      - name: Claim ceiling reminder
        run: |
          echo 'RANDOM_ORDER_BEATS_SLIME != HARDNESS'
          echo 'SLIME_BEATS_RANDOM_SWARM != UNIVERSAL_COMPLETENESS'
          echo 'EXACT_PSWIDTH_PROBE != POLYNOMIAL_RUNTIME_ALGORITHM'
          echo 'P_VS_NP = OPEN'
