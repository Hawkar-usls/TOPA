name: Validate U1-L2B2 Shared Fanout Escape

on:
  push:
    branches:
      - pnp-proof-obligation-graph-u1-l2
    paths:
      - 'research/mathematics/p-vs-np/C025_AKINATOR_U1L2B2_SHARED_FANOUT_LOCAL_GRAMMAR_ESCAPE.md'
      - 'research/mathematics/p-vs-np/u1l2b2_shared_fanout_escape_verifier.py'
      - '.github/workflows/validate-u1l2b2-shared-fanout-escape.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  symbolic-escape-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile verifier
        run: python -m py_compile research/mathematics/p-vs-np/u1l2b2_shared_fanout_escape_verifier.py
      - name: Verify frozen symbolic escape ladder
        run: python research/mathematics/p-vs-np/u1l2b2_shared_fanout_escape_verifier.py
