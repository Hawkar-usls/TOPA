name: Validate JANUS RCTQ-4

on:
  push:
    branches:
      - pnp-proof-obligation-graph-u1-l2-exact-only
    paths:
      - 'research/mathematics/p-vs-np/C025_AKINATOR_RCTQ4_SIGNED_NORMALIZATION_AND_BALANCED_ESCAPE.md'
      - 'research/mathematics/p-vs-np/rctq4_balanced_polarity_escape_verifier.py'
      - '.github/workflows/validate-janus-rctq4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rctq4:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile RCTQ-4 verifier
        run: python -m py_compile research/mathematics/p-vs-np/rctq4_balanced_polarity_escape_verifier.py
      - name: Run RCTQ-4 verifier
        run: python research/mathematics/p-vs-np/rctq4_balanced_polarity_escape_verifier.py
