name: Validate Akinator RSPC

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/C025_AKINATOR_RSPC_SEMANTIC_SURVIVAL_SEARCH_BARRIER.md'
      - 'research/mathematics/p-vs-np/akinator_rspc_semantic_survival_probe.py'
      - 'research/mathematics/p-vs-np/C025_AKINATOR_RSPC_BOUNDED_COVER_EXACT_SURVIVAL.md'
      - 'research/mathematics/p-vs-np/akinator_rspc_bounded_cover_probe.py'
      - 'research/mathematics/p-vs-np/C025_AKINATOR_RSPC_BOUNDED_SUPPORT_ER3_ELIMINATION.md'
      - 'research/mathematics/p-vs-np/akinator_rspc_bounded_support_elimination_probe.py'
      - 'research/mathematics/p-vs-np/C025_AKINATOR_LARGE_SUPPORT_ROBDD_CERTIFICATE.md'
      - 'research/mathematics/p-vs-np/akinator_large_support_robdd_probe.py'
      - 'research/mathematics/p-vs-np/C025_AKINATOR_LIVE_WIDTH_PATH_DP_CERTIFICATE.md'
      - 'research/mathematics/p-vs-np/akinator_live_width_path_dp_probe.py'
      - 'research/mathematics/p-vs-np/C025_AKINATOR_PROOF_CARRYING_ELIMINATION_SELECTOR.md'
      - 'research/mathematics/p-vs-np/akinator_proof_carrying_elimination_probe.py'
      - '.github/workflows/validate-akinator-rspc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-mechanics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run semantic-survival finite mechanics
        run: python research/mathematics/p-vs-np/akinator_rspc_semantic_survival_probe.py
      - name: Run bounded-cover finite mechanics
        run: python research/mathematics/p-vs-np/akinator_rspc_bounded_cover_probe.py
      - name: Run bounded-support elimination finite mechanics
        run: python research/mathematics/p-vs-np/akinator_rspc_bounded_support_elimination_probe.py
      - name: Run large-support ROBDD certificate finite mechanics
        run: python research/mathematics/p-vs-np/akinator_large_support_robdd_probe.py
      - name: Run live-width path-DP finite mechanics
        run: python research/mathematics/p-vs-np/akinator_live_width_path_dp_probe.py
      - name: Run proof-carrying elimination selector finite mechanics
        run: python research/mathematics/p-vs-np/akinator_proof_carrying_elimination_probe.py
      - name: Claim ceiling reminder
        run: |
          echo 'CI checks finite reduction/algebra/substitution/ROBDD/live-width/DP/elimination/certificate mechanics only.'
          echo 'Davis-Putnam exactness, bounded-support ER3 elimination, residual-frontier, live-width DP, and conditional P=NP bridges are analytic/source results, not CI theorems.'
          echo 'Universal ELIM-CAP_C availability and MACRO-RESTORE-CAP availability remain OPEN.'
          echo 'No unrestricted ER3 size lower bound or P vs NP conclusion is claimed.'
          echo 'P_VS_NP = OPEN'
