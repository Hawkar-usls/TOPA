name: Validate Akinator RSPC

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/C025_AKINATOR_RSPC_SEMANTIC_SURVIVAL_SEARCH_BARRIER.md'
      - 'research/mathematics/p-vs-np/akinator_rspc_semantic_survival_probe.py'
      - '.github/workflows/validate-akinator-rspc.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-mechanics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Akinator RSPC finite mechanics
        run: python research/mathematics/p-vs-np/akinator_rspc_semantic_survival_probe.py
      - name: Claim ceiling reminder
        run: |
          echo 'CI checks finite reduction mechanics and the explicit witness-conflict example only.'
          echo 'NP-completeness is the analytic reduction in the note, not a CI result.'
          echo 'No superpolynomial witness-frontier lower bound is claimed.'
          echo 'Source-matched restriction hardness remains OPEN.'
          echo 'P_VS_NP = OPEN'
