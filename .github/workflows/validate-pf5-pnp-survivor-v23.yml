name: Validate PF5 PNP Spiral Survivor v23
on:
  push:
    branches: [pnp-spiral-hephaestus-crystal-v14]
  workflow_dispatch:
jobs:
  survivor-v23:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile research/mathematics/p-vs-np/pf5_pnp_spiral_survivor_v23.py
      - name: Run exact frozen locator
        working-directory: research/mathematics/p-vs-np
        run: python pf5_pnp_spiral_survivor_v23.py --json-out ../../../pf5-pnp-survivor-v23.result.json
      - name: Verify locator contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-pnp-survivor-v23.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-PNP-SPIRAL-SURVIVOR-V23'
          assert d['status']=='FINITE_FROZEN_LOCATOR_COMPLETE'
          assert d['input_holdout']=='V22_FRESH_FROZEN_GROUPS_UNCHANGED'
          assert d['case_count']==32
          assert d['decision_heuristic'] is False
          assert d['new_solver'] is False
          assert d['uses_sat_oracle'] is False
          assert d['uses_truth_table_in_runtime'] is False
          assert d['uses_pswidth_score'] is False
          assert d['uses_hephaestus_for_decision'] is False
          assert d['first_survivor'] is not None
          assert d['survivor_count']==32
          assert d['terminal_true_count']==0
          assert d['terminal_false_count']==0
          assert d['universal_exact_closure']=='OPEN'
          assert d['p_vs_np']=='OPEN'
          print('PF5_V23_LOCATOR_CONTRACT = PASS')
          print('FIRST_SURVIVOR =',(d['first_survivor']['n'],d['first_survivor']['m'],d['first_survivor']['seed']))
          print('FIRST_SURVIVOR_SHA256 =',d['first_survivor']['final_crystal']['sha256'])
          print('ROWS_MANIFEST_SHA256 =',d['rows_manifest_sha256'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling
        run: |
          echo 'V23 = LOCATOR_ONLY'
          echo 'V22_HOLDOUT = REUSED_UNCHANGED'
          echo 'HEPHAESTUS_CRYSTAL = ACCOUNTING_RECURRENCE_ONLY'
          echo 'UNIVERSAL_EXACT_CLOSURE = OPEN'
          echo 'P_VS_NP = OPEN'
