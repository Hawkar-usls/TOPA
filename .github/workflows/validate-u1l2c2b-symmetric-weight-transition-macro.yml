name: Validate U1-L2C2B Symmetric Weight Transition Macro

on:
  push:
    branches:
      - pnp-proof-obligation-graph-u1-l2
    paths:
      - 'research/mathematics/p-vs-np/U1L2C2B_SYMMETRIC_WEIGHT_TRANSITION_MACRO_PROTOCOL.md'
      - 'research/mathematics/p-vs-np/u1l2c2b_symmetric_weight_transition_macro_verifier.py'
      - '.github/workflows/validate-u1l2c2b-symmetric-weight-transition-macro.yml'
  workflow_dispatch:

jobs:
  symmetric-weight-closure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile provider
        run: python -m py_compile research/mathematics/p-vs-np/u1l2c2b_symmetric_weight_transition_macro_verifier.py
      - name: Verify exact symmetric projection, theta fixture escape, and witness replay
        run: python research/mathematics/p-vs-np/u1l2c2b_symmetric_weight_transition_macro_verifier.py
