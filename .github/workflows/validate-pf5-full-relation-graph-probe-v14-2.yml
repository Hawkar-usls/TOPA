name: Validate PF5 Full Relation Graph Probe v14.2

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/pf5_full_relation_graph_probe_v14_2.py'
      - '.github/workflows/validate-pf5-full-relation-graph-probe-v14-2.yml'
  pull_request:
    paths:
      - 'research/mathematics/p-vs-np/pf5_full_relation_graph_probe_v14_2.py'
      - '.github/workflows/validate-pf5-full-relation-graph-probe-v14-2.yml'

permissions:
  contents: read

jobs:
  full-relation-v14-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TOPA
        uses: actions/checkout@v4
        with:
          path: topa
      - name: Checkout pinned Slime v4 producer
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: 321421130fd7a0ffe53c20bdf648f1a9673e4ce4
          path: demiurge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run full-relation audit on observed seed 910000
        working-directory: topa/research/mathematics/p-vs-np
        run: |
          python pf5_full_relation_graph_probe_v14_2.py \
            --producer-path ../../../../demiurge/models/slime/slime_semantic_candidate_router_v4.py \
            --json-out ../../../../pf5-full-relation-graph-probe-v14-2.result.json
      - name: Verify audit-only scope
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-full-relation-graph-probe-v14-2.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-FULL-RELATION-GRAPH-PROBE-V14.2'
          assert d['status']=='POSTHOC_DIAGNOSTIC_COMPLETE'
          assert d['seed']==910000 and d['posthoc_not_holdout'] is True
          assert d['full_relation_count_is_exponential_audit_only'] is True
          assert d['arbitrary_relation_graph_counting_admitted'] is False
          assert d['p_vs_np']=='OPEN'
          print('PF5_FULL_RELATION_GRAPH_V14_2_CONTRACT = PASS')
          print('FULL_DISTINGUISHES_C6_FROM_C5 =',d['full_relation_bound_distinguishes_c6_from_c5'])
          print('C6_EXTRA_CYCLES_HELP =',d['c6_additional_cycles_explain_some_pseudoforest_overestimate'])
          for row in d['choice_rows']:
              print(row['choice'],row['pseudoforest_combined_cap'],row['full_relation_combined_cap_audit_only'],row['max_full_relation_cycle_rank'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling
        run: |
          echo 'FULL_RELATION_COUNT = EXPONENTIAL AUDIT ONLY'
          echo 'ARBITRARY_RELATION_GRAPH_COUNTING NOT ADMITTED'
          echo 'POSTHOC_DIAGNOSTIC != HOLDOUT'
          echo 'P_VS_NP = OPEN'
