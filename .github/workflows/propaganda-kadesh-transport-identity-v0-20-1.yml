name: propaganda-kadesh-transport-identity-v0-20-1

on:
  pull_request:
    branches:
      - topa-propaganda-defense
    paths:
      - 'tools/propaganda_kadesh_transport_identity_gate_v0_20_1.py'
      - '.github/workflows/propaganda-kadesh-transport-identity-v0-20-1.yml'
      - 'research/propaganda-defense/KADESH_TRANSPORT_OBJECT_IDENTITY_GATE.v0.20.json'
      - 'research/propaganda-defense/KADESH_TRANSPORT_IDENTITY_IMPLEMENTATION_CORRECTION.v0.20.1.json'

jobs:
  gate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Replay frozen gate with implementation-only marker-vector correction
        run: python tools/propaganda_kadesh_transport_identity_gate_v0_20_1.py
      - name: Upload corrected gate receipt
        uses: actions/upload-artifact@v4
        with:
          name: kadesh-transport-identity-v0-20-1
          path: research/propaganda-defense/execution/KADESH_TRANSPORT_OBJECT_IDENTITY_RUN.v0.20.1.json
          if-no-files-found: error
          retention-days: 30
