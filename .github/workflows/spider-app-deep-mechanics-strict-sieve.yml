name: TOPA Spider — APP Deep Mechanics Strict Sieve

on:
  push:
    branches: [main]
    paths:
      - 'tools/topa_app_deep_mechanics_strict_sieve.py'
      - '.github/workflows/spider-app-deep-mechanics-strict-sieve.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strict-sieve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Clone frozen JANUS snapshots
        run: |
          git clone --filter=blob:none https://github.com/Hawkar-usls/janus-meta-registry.git work/meta
          git -C work/meta fetch origin \
            e428099d2afd6cec347a861996a236b6a69c18e5 \
            64a14c297914dffd3d6840c29f558e39d4ba4607 \
            c819a27e116273132c087ff9318760651e496ead
          git -C work/meta worktree add ../meta-yesterday 64a14c297914dffd3d6840c29f558e39d4ba4607
          git -C work/meta worktree add ../meta-current c819a27e116273132c087ff9318760651e496ead
      - name: Run strict conjunctive sieve
        run: |
          mkdir -p work/app-strict-sieve
          python tools/topa_app_deep_mechanics_strict_sieve.py \
            --yesterday-root work/meta-yesterday \
            --current-root work/meta-current \
            --source-ref e428099d2afd6cec347a861996a236b6a69c18e5 \
            --source-blob 132215e2c556498f03ca8ddc4583b8f580c38837 \
            --yesterday-ref 64a14c297914dffd3d6840c29f558e39d4ba4607 \
            --current-ref c819a27e116273132c087ff9318760651e496ead \
            --out work/app-strict-sieve/JANUS-TOPA-APP-DEEP-MECHANICS-STRICT-SIEVE.json
      - name: Scientific firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('work/app-strict-sieve/JANUS-TOPA-APP-DEEP-MECHANICS-STRICT-SIEVE.json').read_text(encoding='utf-8'))
          assert x['status']=='PASS'
          assert 'STRICT_CO_OCCURRENCE != CAUSATION' in x['scientific_firewall']
          assert 'NO_HIT != NO_RELATION' in x['scientific_firewall']
          print(json.dumps(x['summary'],ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: topa-app-deep-mechanics-strict-sieve
          path: work/app-strict-sieve/JANUS-TOPA-APP-DEEP-MECHANICS-STRICT-SIEVE.json
          retention-days: 30
