name: Validate PF5 Projection Chain Cap Probe v12.2

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/pf5_projection_chain_cap_probe_v12_2.py'
      - '.github/workflows/validate-pf5-projection-chain-cap-probe-v12-2.yml'
  pull_request:
    paths:
      - 'research/mathematics/p-vs-np/pf5_projection_chain_cap_probe_v12_2.py'
      - '.github/workflows/validate-pf5-projection-chain-cap-probe-v12-2.yml'

permissions:
  contents: read

jobs:
  projection-chain-cap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TOPA
        uses: actions/checkout@v4
        with:
          path: topa
      - name: Checkout pinned Slime v2 producer
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: 6bb9ed246a4740e0d4488d3df6848f266e1e32f4
          path: demiurge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run observed-gap theorem feature probe
        working-directory: topa/research/mathematics/p-vs-np
        run: |
          python pf5_projection_chain_cap_probe_v12_2.py \
            --producer-path ../../../../demiurge/models/slime/slime_semantic_candidate_router_v2.py \
            --json-out ../../../../pf5-projection-chain-cap-probe-v12-2.result.json
      - name: Verify theorem feature scope
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-projection-chain-cap-probe-v12-2.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-PROJECTION-CHAIN-CAP-PROBE-V12.2'
          assert d['status']=='POSTHOC_THEOREM_FEATURE_PROBE_COMPLETE'
          assert d['seed']==908001 and d['posthoc_not_holdout'] is True
          assert d['theorem']['source_only'] is True
          assert d['theorem']['polynomial_feature_construction'] is True
          assert d['theorem']['duplicate_projected_clauses_collapsed'] is True
          assert d['p_vs_np']=='OPEN'
          print('PF5_PROJECTION_CHAIN_CAP_V12_2_CONTRACT = PASS')
          print('CHAIN_CAP_BREAKS_TIE_HELPFULLY =',d['chain_cap_breaks_observed_v2_tie_in_helpful_direction'])
          print('V2_CHOSEN =',d['chosen_row'])
          print('CHAIN_BEST_ROWS =',d['chain_cap_best_rows'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling
        run: |
          echo 'PROJECTION_CHAIN_CAP = UPPER BOUND ONLY'
          echo 'POSTHOC_FEATURE_PROBE != HOLDOUT'
          echo 'P_VS_NP = OPEN'
