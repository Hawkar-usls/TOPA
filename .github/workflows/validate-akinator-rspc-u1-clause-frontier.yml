name: Validate Akinator RSPC U1 Clause Frontier

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/C025_AKINATOR_RSPC_U1_CLAUSE_FRONTIER_WIDTH_DICHOTOMY.md'
      - 'research/mathematics/p-vs-np/akinator_rspc_u1_clause_frontier_probe.py'
      - '.github/workflows/validate-akinator-rspc-u1-clause-frontier.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-mechanics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run U1 clause-frontier finite mechanics
        run: python research/mathematics/p-vs-np/akinator_rspc_u1_clause_frontier_probe.py
      - name: Claim ceiling reminder
        run: |
          echo 'CI checks exact clause counts and small width-saturation mechanics only.'
          echo 'Expander G-PHP width lower bounds are external/frozen analytical results.'
          echo 'Exponential complete-frontier count is not a sparse-proof lower bound.'
          echo 'B2/ER remains open.'
          echo 'P_VS_NP = OPEN'
