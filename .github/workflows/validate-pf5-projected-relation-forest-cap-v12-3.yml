name: Validate PF5 Projected Relation Forest Cap v12.3

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/pf5_projected_relation_forest_cap_probe_v12_3.py'
      - '.github/workflows/validate-pf5-projected-relation-forest-cap-v12-3.yml'
  pull_request:
    paths:
      - 'research/mathematics/p-vs-np/pf5_projected_relation_forest_cap_probe_v12_3.py'
      - '.github/workflows/validate-pf5-projected-relation-forest-cap-v12-3.yml'

permissions:
  contents: read

jobs:
  relation-forest-cap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TOPA
        uses: actions/checkout@v4
        with:
          path: topa
      - name: Checkout pinned Slime v2 producer
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: 6bb9ed246a4740e0d4488d3df6848f266e1e32f4
          path: demiurge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run observed-gap relation-forest feature probe
        working-directory: topa/research/mathematics/p-vs-np
        run: |
          python pf5_projected_relation_forest_cap_probe_v12_3.py \
            --producer-path ../../../../demiurge/models/slime/slime_semantic_candidate_router_v2.py \
            --json-out ../../../../pf5-projected-relation-forest-cap-v12-3.result.json
      - name: Verify source-only theorem scope
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-projected-relation-forest-cap-v12-3.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-PROJECTED-RELATION-FOREST-CAP-PROBE-V12.3'
          assert d['status']=='POSTHOC_THEOREM_FEATURE_PROBE_COMPLETE'
          assert d['seed']==908001 and d['posthoc_not_holdout'] is True
          assert d['theorem']['source_only'] is True
          assert d['theorem']['polynomial_feature_construction'] is True
          assert d['theorem']['acyclic_relation_subset_counted_by_tree_dp'] is True
          assert d['p_vs_np']=='OPEN'
          print('PF5_PROJECTED_RELATION_FOREST_CAP_V12_3_CONTRACT = PASS')
          print('BREAKS_TIE_HELPFULLY =',d['relation_forest_breaks_observed_v2_tie_in_helpful_direction'])
          print('CHOSEN =',d['chosen_row'])
          print('BEST =',d['relation_forest_best_rows'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling
        run: |
          echo 'RELATION_FOREST_CAP = UPPER BOUND ONLY'
          echo 'POSTHOC_FEATURE_PROBE != HOLDOUT'
          echo 'P_VS_NP = OPEN'
