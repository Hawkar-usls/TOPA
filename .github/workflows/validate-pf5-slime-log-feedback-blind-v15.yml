name: Validate PF5 Slime Log Feedback Blind v15

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/pf5_slime_log_feedback_blind_v15.py'
      - '.github/workflows/validate-pf5-slime-log-feedback-blind-v15.yml'
  pull_request:
    paths:
      - 'research/mathematics/p-vs-np/pf5_slime_log_feedback_blind_v15.py'
      - '.github/workflows/validate-pf5-slime-log-feedback-blind-v15.yml'

permissions:
  contents: read

jobs:
  blind-log-feedback:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TOPA
        uses: actions/checkout@v4
        with:
          path: topa
      - name: Checkout pinned Slime v5.1 producer
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: e507484a62eb29543910cd018c380150051f986f
          path: demiurge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Freeze v5 manifests then run exact DP judge
        working-directory: topa/research/mathematics/p-vs-np
        run: |
          python pf5_slime_log_feedback_blind_v15.py \
            --producer-path ../../../../demiurge/models/slime/slime_semantic_candidate_router_v5_1.py \
            --json-out ../../../../pf5-slime-log-feedback-blind-v15.result.json
      - name: Verify blind firewall
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-slime-log-feedback-blind-v15.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-SLIME-LOG-FEEDBACK-BLIND-V15'
          assert d['status']=='FINITE_BLIND_EXACT_OPTIMUM_AUDIT_COMPLETE'
          assert d['producer_feature']=='LOG_FEEDBACK_RELATION_CAP'
          assert d['fixed_capability_exponent_q']==2
          assert d['feedback_admission_rule']=='4^r <= L^2'
          assert d['calibration_seed_already_observed']==910000
          assert d['calibration_excluded_from_holdout_summary'] is True
          assert d['holdout_seeds_frozen_before_provider_run']==list(range(911000,911016))
          assert d['all_sources_and_manifests_frozen_before_exact_dp'] is True
          assert d['adaptive_candidate_generation_after_exact_dp'] is False
          assert d['exact_dp_is_exponential_audit_oracle_not_runtime_algorithm'] is True
          assert d['log_feedback_cap_is_restricted_polynomial_message_language'] is True
          assert d['arbitrary_relation_graph_counting_admitted'] is False
          s=d['holdout_summary']
          assert s['holdout_cases']==16
          for field in ['v5_vs_v4','v5_vs_v3','v5_vs_v2','v5_vs_v1']:
              assert s[f'{field}_wins']+s[f'{field}_ties']+s[f'{field}_losses']==16
          assert d['universal_candidate_completeness']=='OPEN'
          assert d['universal_polynomial_semantic_decomposition_discovery']=='OPEN'
          assert d['p_vs_np']=='OPEN'
          for row in d['controls']:
              for name in [
                  'SLIME_SEMANTIC_PRESSURE',
                  'SLIME_SIGNATURE_CAP_PRESSURE',
                  'SLIME_RELATION_FOREST_PRESSURE',
                  'SLIME_RELATION_PSEUDOFOREST_PRESSURE',
                  'SLIME_LOG_FEEDBACK_RELATION_PRESSURE',
              ]:
                  assert name in row['candidate_widths']
              assert row['exact_optimal_width'] <= min(row['candidate_widths'].values())
              assert row['v5_gap']==row['v5_width']-row['exact_optimal_width']
          print('PF5_SLIME_LOG_FEEDBACK_V15_CONTRACT = PASS')
          print('CALIBRATION =',d['calibration']['v1_width'],d['calibration']['v2_width'],d['calibration']['v3_width'],d['calibration']['v4_width'],d['calibration']['v5_width'],d['calibration']['exact_optimal_width'])
          print('HOLDOUT_SUMMARY =',s)
          print('MANIFEST_BATCH_SHA256 =',d['manifest_batch_sha256'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling
        run: |
          echo 'KNOWN_CALIBRATION != BLIND_VALIDATION'
          echo 'LOG_FEEDBACK_RELATION_CAP = RESTRICTED POLYNOMIAL MESSAGE LANGUAGE'
          echo '4^r <= L^2 IS FROZEN'
          echo 'ARBITRARY_RELATION_GRAPH_COUNTING NOT ADMITTED'
          echo 'FINITE_HOLDOUT_IMPROVEMENT != UNIVERSAL_COMPLETENESS'
          echo 'P_VS_NP = OPEN'
