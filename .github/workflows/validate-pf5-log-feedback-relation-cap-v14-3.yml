name: Validate PF5 Log Feedback Relation Cap v14.3

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/pf5_log_feedback_relation_cap_probe_v14_3.py'
      - '.github/workflows/validate-pf5-log-feedback-relation-cap-v14-3.yml'
  pull_request:
    paths:
      - 'research/mathematics/p-vs-np/pf5_log_feedback_relation_cap_probe_v14_3.py'
      - '.github/workflows/validate-pf5-log-feedback-relation-cap-v14-3.yml'

permissions:
  contents: read

jobs:
  log-feedback-cap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TOPA
        uses: actions/checkout@v4
        with:
          path: topa
      - name: Checkout pinned Slime v4 producer
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Demiurge
          ref: 321421130fd7a0ffe53c20bdf648f1a9673e4ce4
          path: demiurge
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run logarithmic feedback theorem feature probe
        working-directory: topa/research/mathematics/p-vs-np
        run: |
          python pf5_log_feedback_relation_cap_probe_v14_3.py \
            --producer-path ../../../../demiurge/models/slime/slime_semantic_candidate_router_v4.py \
            --json-out ../../../../pf5-log-feedback-relation-cap-v14-3.result.json
      - name: Verify polynomial admission contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-log-feedback-relation-cap-v14-3.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-LOG-FEEDBACK-RELATION-CAP-PROBE-V14.3'
          assert d['status']=='POSTHOC_THEOREM_FEATURE_PROBE_COMPLETE'
          assert d['seed']==910000 and d['posthoc_not_holdout'] is True
          assert d['capability_exponent_q_frozen']==2
          th=d['theorem']
          assert th['endpoint_assignments_at_most_4_pow_r'] is True
          assert th['forest_remainder_counted_exactly_by_tree_dp'] is True
          assert th['admitted_work_is_polynomial_in_explicit_source'] is True
          assert th['source_only'] is True
          assert th['arbitrary_relation_graph_counting_admitted'] is False
          assert d['p_vs_np']=='OPEN'
          print('PF5_LOG_FEEDBACK_RELATION_CAP_V14_3_CONTRACT = PASS')
          print('DISTINGUISHES =',d['bounded_feedback_cap_distinguishes_c6_from_c5'])
          for row in d['choice_rows']:
              print(row['choice'],row['status'],row['combined_cap'],row['left']['cycle_rank'],row['right']['cycle_rank'],row['left']['enumeration_rows'],row['right']['enumeration_rows'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling
        run: |
          echo 'LOG_FEEDBACK_RELATION_CAP = RESTRICTED POLYNOMIAL MESSAGE LANGUAGE'
          echo 'ARBITRARY_RELATION_GRAPH_COUNTING NOT ADMITTED'
          echo 'POSTHOC_FEATURE_PROBE != BLIND_HOLDOUT'
          echo 'P_VS_NP = OPEN'
