name: Validate PF5 Single-Resolvent Exact Projection v15
on:
  push:
    branches: [pnp-spiral-hephaestus-crystal-v14]
  workflow_dispatch:
jobs:
  single-resolvent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile
        run: python -m py_compile research/mathematics/p-vs-np/pf5_single_resolvent_exact_projection_v15.py
      - name: Run frozen blind theorem audit
        working-directory: research/mathematics/p-vs-np
        run: python pf5_single_resolvent_exact_projection_v15.py --json-out ../../../pf5-single-resolvent-v15.result.json
      - name: Verify theorem-only runtime contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-single-resolvent-v15.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-SINGLE-RESOLVENT-EXACT-PROJECTION-V15'
          assert d['status']=='FINITE_BLIND_EXACT_PROJECTION_AUDIT_COMPLETE'
          assert d['feature']=='SINGLE_NONTAUTOLOGICAL_RESOLVENT_EXISTENTIAL_PROJECTION'
          assert d['feature_is_heuristic'] is False
          assert d['uses_slime'] is False
          assert d['uses_sat_oracle'] is False
          assert d['uses_pswidth_score'] is False
          assert d['uses_truth_table_in_runtime'] is False
          assert d['holdout_seeds_frozen_before_provider_run']==list(range(910000,910032))
          assert d['holdout_not_conditioned_on_feature_presence'] is True
          assert d['all_reductions_frozen_before_semantic_audit'] is True
          assert d['diagnostic']['seed']==907004
          assert d['diagnostic']['first_v15_certificate']['variable']==1
          assert d['diagnostic']['first_v15_certificate']['unique_non_tautological_resolvent_count']==1
          assert d['diagnostic']['solved_to_empty'] is True
          assert d['summary']['cases']==32
          assert d['summary']['all_semantic_audits_pass'] is True
          assert d['runtime_rule_polynomial_in_explicit_residual_size'] is True
          assert d['witness_lift_replayable_from_certificate'] is True
          assert d['p_vs_np']=='OPEN'
          print('PF5_V15_THEOREM_ONLY_CONTRACT = PASS')
          print('SUMMARY =',d['summary'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling
        run: |
          echo 'SINGLE_NONTAUTOLOGICAL_RESOLVENT_EXISTENTIAL_PROJECTION = EXACT'
          echo 'HEPHAESTUS_CRYSTAL = ACCOUNTING_RECURRENCE_ONLY'
          echo 'P_VS_NP = OPEN'
