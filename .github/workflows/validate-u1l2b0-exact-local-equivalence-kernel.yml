name: Validate U1-L2B0 Exact Local Equivalence Kernel

on:
  push:
    branches:
      - pnp-proof-obligation-graph-u1-l2
    paths:
      - 'research/mathematics/p-vs-np/C025_AKINATOR_U1L2B0_EXACT_LOCAL_EQUIVALENCE_KERNEL.md'
      - 'research/mathematics/p-vs-np/u1l2b0_exact_local_equivalence_kernel.py'
      - '.github/workflows/validate-u1l2b0-exact-local-equivalence-kernel.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exhaustive-local-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile provider
        run: python -m py_compile research/mathematics/p-vs-np/u1l2b0_exact_local_equivalence_kernel.py
      - name: Exhaust frozen k=4 g<=3 B2 local algebra
        run: python research/mathematics/p-vs-np/u1l2b0_exact_local_equivalence_kernel.py
