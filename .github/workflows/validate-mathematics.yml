name: Validate TOPA mathematics

on:
  push:
    paths:
      - 'research/mathematics/**'
      - 'data/TOPA-MATHEMATICAL-RESEARCH-MODE-*.json'
      - 'data/TOPA-P-VS-NP-*.json'
      - 'data/TOPA-C025-*.json'
      - 'data/JANUS-P-VS-NP-*.json'
      - 'registry/TOPA-CANONICAL-HOME-*.json'
      - '.github/workflows/validate-mathematics.yml'
  pull_request:
    paths:
      - 'research/mathematics/**'
      - 'data/TOPA-MATHEMATICAL-RESEARCH-MODE-*.json'
      - 'data/TOPA-P-VS-NP-*.json'
      - 'data/TOPA-C025-*.json'
      - 'data/JANUS-P-VS-NP-*.json'
      - 'registry/TOPA-CANONICAL-HOME-*.json'
      - '.github/workflows/validate-mathematics.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Validate JSON receipts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          targets = sorted(Path('data').glob('TOPA-MATHEMATICAL-RESEARCH-MODE-*.json'))
          targets += sorted(Path('data').glob('TOPA-P-VS-NP-*.json'))
          targets += sorted(Path('data').glob('TOPA-C025-*.json'))
          targets += sorted(Path('data').glob('JANUS-P-VS-NP-*.json'))
          targets += sorted(Path('registry').glob('TOPA-CANONICAL-HOME-*.json'))
          if not targets:
              raise SystemExit('no mathematical JSON receipts found')
          for path in targets:
              json.loads(path.read_text(encoding='utf-8'))
              print(f'JSON_PASS {path}')
          PY

      - name: Compile mathematical probes
        run: |
          python -m py_compile research/mathematics/p-vs-np/*.py

      - name: Replay theorem-matched GT encoding
        run: |
          python research/mathematics/p-vs-np/source_gt.py

      - name: Replay Issue 211 finite mechanics
        run: |
          cd research/mathematics/p-vs-np
          python policy0a_padded_gt_counterfamily.py

      - name: Replay Policy-0B fair scheduler
        run: |
          cd research/mathematics/p-vs-np
          python policy0b_fair_scheduler_probe.py

      - name: Replay C025-B proof-carrying reason verifier
        run: |
          cd research/mathematics/p-vs-np
          python proof_carrying_reason.py
