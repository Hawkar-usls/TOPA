name: Validate TOPA SPIDER Relation Pull v2

on:
  push:
    paths:
      - 'tools/topa_spider_v24.py'
      - 'tools/topa_spider_seed_bridge.py'
      - 'tools/topa_archive_gateway_v13.py'
      - 'tools/topa_archive_gateway_v12.py'
      - 'tools/topa_archive_enricher.py'
      - 'tools/topa_repo_assimilator.py'
      - 'protocols/TOPA_SPIDER_RELATION_DRIVEN_PULL_PROTOCOL_v2.4.json'
      - 'raw/unexamined/archive/bootstrap-2026-08-27/archive-bootstrap-seeds.jsonl'
      - '.github/workflows/spider-relation-pull-v2.yml'
  workflow_dispatch:

# LIVE_SEARCH_MARKER: 2026-08-27T17:31:00+03:00
# CIA official mobile collection listing fallback; selective deep fetch only.
# No fixed topic and no query steering.

jobs:
  selective-spider:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Self-test SPIDER v2.4
        run: python tools/topa_spider_v24.py self-test
      - name: Self-test Archive Gateway v1.3
        run: python tools/topa_archive_gateway_v13.py self-test
      - name: Self-test selective archive enricher
        run: python tools/topa_archive_enricher.py self-test
      - name: Self-test repo-memory bridge
        run: python tools/topa_spider_seed_bridge.py self-test
      - name: Assimilate complete TOPA research memory
        run: |
          mkdir -p work/spider-deep
          python tools/topa_repo_assimilator.py scan \
            --root . \
            --out-index work/spider-deep/repo-index.jsonl \
            --out-queue work/spider-deep/repo-routing-queue.jsonl \
            --receipt work/spider-deep/repo-assimilation-receipt.json
          python tools/topa_spider_seed_bridge.py build \
            --index work/spider-deep/repo-index.jsonl \
            --root . \
            --out work/spider-deep/repo-spider-seeds.jsonl \
            --receipt work/spider-deep/repo-spider-seeds-receipt.json \
            --max-bytes 80000
          cat raw/unexamined/archive/bootstrap-2026-08-27/archive-bootstrap-seeds.jsonl \
              work/spider-deep/repo-spider-seeds.jsonl > work/spider-deep/composite-seed-web.jsonl
      - name: Broad official archive inventory stays ephemeral
        run: |
          python tools/topa_archive_gateway_v13.py ingest \
            --providers nara,cia,nsa,fbi \
            --limit 100 \
            --cia-pages 20 \
            --cia-start-page 0 \
            --expand-nara \
            --out work/spider-deep/archive-survey.jsonl \
            --receipt work/spider-deep/archive-survey-receipt.json
      - name: Frontier round 1 select pointers only
        run: |
          python tools/topa_spider_v24.py pull \
            --seed work/spider-deep/composite-seed-web.jsonl \
            --survey work/spider-deep/archive-survey.jsonl \
            --out work/spider-deep/pull-r1.jsonl \
            --receipt work/spider-deep/pull-r1-receipt.json \
            --threshold 0.24 \
            --semantic-only-threshold 0.42 \
            --max-pull 25 \
            --rounds 1
      - name: Deep-fetch only round-1 connected pointers
        run: |
          python tools/topa_archive_enricher.py enrich \
            --input work/spider-deep/pull-r1.jsonl \
            --out work/spider-deep/enriched-r1.jsonl \
            --receipt work/spider-deep/enriched-r1-receipt.json
          cat work/spider-deep/composite-seed-web.jsonl \
              work/spider-deep/enriched-r1.jsonl > work/spider-deep/frontier-r2-seeds.jsonl
      - name: Frontier round 2 search from newly read content
        run: |
          python tools/topa_spider_v24.py pull \
            --seed work/spider-deep/frontier-r2-seeds.jsonl \
            --survey work/spider-deep/archive-survey.jsonl \
            --out work/spider-deep/pull-r2.jsonl \
            --receipt work/spider-deep/pull-r2-receipt.json \
            --threshold 0.24 \
            --semantic-only-threshold 0.42 \
            --max-pull 25 \
            --rounds 1
          python tools/topa_archive_enricher.py enrich \
            --input work/spider-deep/pull-r2.jsonl \
            --out work/spider-deep/enriched-r2.jsonl \
            --receipt work/spider-deep/enriched-r2-receipt.json
      - name: Deduplicate accepted enriched frontier and weave
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          src=['work/spider-deep/enriched-r1.jsonl','work/spider-deep/enriched-r2.jsonl']
          by={}
          for fn in src:
              for line in Path(fn).read_text().splitlines():
                  if not line.strip(): continue
                  r=json.loads(line)
                  key=(r.get('provider'),r.get('archive_id'),r.get('source_url'))
                  by[key]=r
          out=Path('work/spider-deep/spider-pulled-enriched.jsonl')
          out.write_text(''.join(json.dumps(r,ensure_ascii=False,sort_keys=True,separators=(',',':'))+'\n' for _,r in sorted(by.items(),key=lambda kv:str(kv[0]))),encoding='utf-8')
          print('DEDUP_ENRICHED_PULLS',len(by))
          PY
          cat raw/unexamined/archive/bootstrap-2026-08-27/archive-bootstrap-seeds.jsonl \
              work/spider-deep/spider-pulled-enriched.jsonl > work/spider-deep/archive-web.jsonl
          python tools/topa_spider_v24.py weave \
            --input work/spider-deep/archive-web.jsonl \
            --nodes work/spider-deep/spider-nodes.jsonl \
            --edges work/spider-deep/spider-edges.jsonl \
            --receipt work/spider-deep/spider-weave-receipt.json \
            --semantic-threshold 0.14 \
            --topk 8 \
            --keyword-nodes 12
      - name: Scientific firewall assertions
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          survey=json.loads(Path('work/spider-deep/archive-survey-receipt.json').read_text())
          p1=json.loads(Path('work/spider-deep/pull-r1-receipt.json').read_text())
          p2=json.loads(Path('work/spider-deep/pull-r2-receipt.json').read_text())
          e1=json.loads(Path('work/spider-deep/enriched-r1-receipt.json').read_text())
          w=json.loads(Path('work/spider-deep/spider-weave-receipt.json').read_text())
          assert survey['status']=='PASS' and p1['status']=='PASS' and p2['status']=='PASS'
          assert p1.get('query') is None and p2.get('query') is None
          assert p1['survey_candidates'] >= p1['pulled_documents']
          assert 'NO_FIXED_HYPOTHESIS_CENTER' in w['laws']
          cia=(survey.get('provider_receipts') or {}).get('cia_collection') or {}
          assert cia.get('retrieval_policy')=='LISTING_POINTERS_ONLY__DEEP_FETCH_REQUIRES_SPIDER_SELECTION'
          assert e1['input_records']==p1['pulled_documents']
          print('SPIDER_CIA_MOBILE_SELECTIVE_DEEP_FETCH=PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: topa-spider-deep-search-v13
          path: work/spider-deep
          retention-days: 14
