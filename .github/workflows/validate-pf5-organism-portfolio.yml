name: Validate PF5 Organism Portfolio

on:
  push:
    paths:
      - 'data/PF5_OPERATOR_PORTFOLIO_CONTRACT.json'
      - 'research/mathematics/p-vs-np/C025_AKINATOR_PREBIRTH_PIVOT_FACTORIZATION.md'
      - 'research/mathematics/p-vs-np/C025_AKINATOR_PF2_FUNCTION_TO_RELATION_BOUNDARY.md'
      - 'research/mathematics/p-vs-np/C025_AKINATOR_PF3_SYNTACTIC_SHANNON_EQUALITY_BARRIER.md'
      - 'research/mathematics/p-vs-np/akinator_prebirth_pivot_factor_probe.py'
      - 'research/mathematics/p-vs-np/akinator_pf2_function_relation_probe.py'
      - 'research/mathematics/p-vs-np/akinator_pf3_syntactic_shannon_probe.py'
      - 'research/mathematics/p-vs-np/pf5_pf1_gt12_holdout_probe.py'
      - 'research/mathematics/p-vs-np/pf5_pf1_gt12_normalized_handoff_probe.py'
      - '.github/workflows/validate-pf5-organism-portfolio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-repo-exact-controls:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout current TOPA
        uses: actions/checkout@v4
        with:
          path: topa

      - name: Checkout frozen Fundamentum C025/BH-Q2 source
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Fundamentum
          ref: 122ccf2c1082fc5967d063dc7b73ac8e26c9325d
          path: fundamentum

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify pinned historical source identity
        shell: bash
        run: |
          test "$(git -C fundamentum rev-parse HEAD)" = "122ccf2c1082fc5967d063dc7b73ac8e26c9325d"
          python - <<'PY'
          expected = {
              'fundamentum/experiments/direct/janus_c025_core.py': '414c81edf4e20248965d12069b2fe88937f9f7e1',
              'fundamentum/experiments/direct/janus_c025_families.py': '4385c73819a53ae624717edff7edc10a4de7b998',
              'fundamentum/experiments/direct/janus_certified_residual_quotient.py': 'aef9ddefb9d4aff5cddc6852363c3fdc7c418693',
          }
          import subprocess
          for path, expected_blob in expected.items():
              rel = path.split('/', 1)[1]
              actual = subprocess.check_output(['git','-C','fundamentum','hash-object',rel], text=True).strip()
              assert actual == expected_blob, (rel, actual, expected_blob)
          print('PF5_FROZEN_C025_BLOB_IDENTITY = PASS')
          PY

      - name: Validate PF5 contract JSON
        run: python -m json.tool topa/data/PF5_OPERATOR_PORTFOLIO_CONTRACT.json >/dev/null

      - name: Replay historical certified residual quotient controls
        working-directory: fundamentum/experiments/direct
        run: |
          python janus_certified_residual_quotient.py --output /tmp/pf5_c025.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/pf5_c025.json'))
          assert r['status']=='PASS'
          assert r['assertions']['absorption_certified_collapse']
          assert r['assertions']['equality_true_exponential_width']
          assert r['assertions']['equality_good_order_exact']
          assert r['assertions']['merge_barrier_exact']
          print('PF5_C025_CERTIFIED_RESIDUAL_QUOTIENT_CONTROLS = PASS')
          print('PF5_C025_LOCATED_BOTTLENECK =', r['located_bottleneck']['name'])
          PY

      - name: Replay current TOPA PF1/PF2/PF3 controls
        run: |
          python topa/research/mathematics/p-vs-np/akinator_prebirth_pivot_factor_probe.py
          python topa/research/mathematics/p-vs-np/akinator_pf2_function_relation_probe.py
          python topa/research/mathematics/p-vs-np/akinator_pf3_syntactic_shannon_probe.py

      - name: Run PF1 on frozen historical GT12 holdout
        run: |
          python topa/research/mathematics/p-vs-np/pf5_pf1_gt12_holdout_probe.py \
            --fundamentum-root fundamentum \
            --output /tmp/pf5_pf1_gt12.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/pf5_pf1_gt12.json'))
          assert r['subject']['family']=='GRAPH_TAUTOLOGY'
          assert r['subject']['order']==12
          assert r['subject']['original_variables']==66
          assert r['frozen_policy']['encoding_cap']==200000
          assert r['frozen_policy']['posthoc_cap_raise_allowed'] is False
          assert r['p_vs_np']=='OPEN'
          print('PF5_PF1_GT12_TERMINAL =', r['terminal'])
          print('PF5_PF1_GT12_ROOTS_PROCESSED =', r['roots_processed'])
          print('PF5_PF1_GT12_PEAK_UNITS =', r['peak_units'])
          print('PF5_PF1_GT12_FINAL_UNITS =', r['final_units'])
          print('PF5_PF1_GT12_CUMULATIVE_GATES =', r['cumulative_b2_gates_added'])
          print('PF5_PF1_GT12_AVOIDED_PAIR_PROXY =', r['cumulative_pair_attempts_avoided_proxy'])
          print('PF5_PF1_GT12_DIAGNOSTIC_PAIR_WORK =', r['cumulative_diagnostic_pair_materializations'])
          if r['automaton_handoff'] is not None:
              print('PF5_PF1_GT12_HANDOFF =', r['automaton_handoff']['status'])
              print('PF5_PF1_GT12_HANDOFF_STATES =', r['automaton_handoff']['residual_states'])
          PY

      - name: Run certified subsumption successor on GT12 PF1 residue
        run: |
          python topa/research/mathematics/p-vs-np/pf5_pf1_gt12_normalized_handoff_probe.py \
            --topa-root topa \
            --fundamentum-root fundamentum \
            --output /tmp/pf5_pf1_gt12_norm.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/pf5_pf1_gt12_norm.json'))
          assert r['experiment_class']=='MECHANISTIC_SUCCESSOR_NOT_INDEPENDENT_HOLDOUT'
          assert r['frozen_caps']['normalization_subset_probe_cap']==500000
          assert r['frozen_caps']['handoff_encoding_cap']==20000
          assert r['frozen_caps']['posthoc_cap_raise_allowed'] is False
          assert r['p_vs_np']=='OPEN'
          n=r['certified_normalization']
          print('PF5_GT12_NORM_TERMINAL =', r['terminal'])
          print('PF5_GT12_NORM_BEFORE_UNITS =', r['pf1_residue']['units'])
          print('PF5_GT12_NORM_SUBSET_PROBES =', n['subset_probes'])
          print('PF5_GT12_NORM_CERT_STEPS =', n['certificate_steps'])
          print('PF5_GT12_NORM_CERT_VERIFIED =', n['certificate_verified'])
          print('PF5_GT12_NORM_AFTER_UNITS =', n['normalized_units'])
          print('PF5_GT12_NORM_AFTER_CLAUSES =', n['normalized_clauses'])
          print('PF5_GT12_NORM_AFTER_VARIABLES =', n['normalized_variables'])
          if r['automaton_handoff'] is not None:
              print('PF5_GT12_NORM_HANDOFF =', r['automaton_handoff']['status'])
              print('PF5_GT12_NORM_HANDOFF_STATES =', r['automaton_handoff']['residual_states'])
          PY

      - name: Portfolio scientific ceiling
        run: |
          echo 'PF5_CROSS_REPO_ORGANISM_REPLAY = PASS'
          echo 'POLYNOMIALLY_DISCOVERABLE_DECOMPOSITION_PLUS_CHEAP_CERTIFIED_QUOTIENT = OPEN'
          echo 'PF5_UNIVERSAL_COVERAGE = OPEN'
          echo 'P_VS_NP = OPEN'
