name: Observe U1-L2B1 AC Gate Tradeoff

on:
  push:
    branches:
      - pnp-proof-obligation-graph-u1-l2
    paths:
      - 'research/mathematics/p-vs-np/u1l2b1_ac_gate_tradeoff_observer.py'
      - '.github/workflows/observe-u1l2b1-ac-gate-tradeoff.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-tradeoff-observer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile observer
        run: |
          python -m py_compile research/mathematics/p-vs-np/u1l2b0_exact_local_equivalence_kernel.py
          python -m py_compile research/mathematics/p-vs-np/u1l2b1_ac_gate_tradeoff_observer.py
      - name: Exhaust exact local AC/gate Pareto tradeoffs
        working-directory: research/mathematics/p-vs-np
        run: python u1l2b1_ac_gate_tradeoff_observer.py
