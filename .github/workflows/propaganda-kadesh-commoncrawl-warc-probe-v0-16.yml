name: propaganda-kadesh-commoncrawl-warc-probe-v0-16

on:
  pull_request:
    branches:
      - topa-propaganda-defense
    paths:
      - 'tools/propaganda_kadesh_commoncrawl_warc_probe_v0_16.py'
      - '.github/workflows/propaganda-kadesh-commoncrawl-warc-probe-v0-16.yml'
      - 'research/propaganda-defense/**'

jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe version-pinned Common Crawl WARC snapshots
        run: python tools/propaganda_kadesh_commoncrawl_warc_probe_v0_16.py
      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kadesh-commoncrawl-warc-probe-v0-16
          path: research/propaganda-defense/execution/KADESH_COMMONCRAWL_WARC_PROBE.v0.16.json
          if-no-files-found: error
          retention-days: 30
