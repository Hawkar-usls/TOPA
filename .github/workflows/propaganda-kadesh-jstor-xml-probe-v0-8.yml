name: propaganda-kadesh-jstor-xml-probe-v0-8

on:
  pull_request:
    branches:
      - topa-propaganda-defense
    paths:
      - 'tools/propaganda_kadesh_jstor_xml_probe_v0_8.py'
      - '.github/workflows/propaganda-kadesh-jstor-xml-probe-v0-8.yml'
      - 'research/propaganda-defense/**'

jobs:
  probe:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe official JSTOR XML for stable 528771
        run: python tools/propaganda_kadesh_jstor_xml_probe_v0_8.py
      - name: Upload diagnostic receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kadesh-jstor-xml-probe-v0-8
          path: research/propaganda-defense/execution/KADESH_JSTOR_XML_PROBE.v0.8.json
          if-no-files-found: error
          retention-days: 30
