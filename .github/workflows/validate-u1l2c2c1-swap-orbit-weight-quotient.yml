name: Validate U1-L2C2C1 Swap Orbit Weight Quotient

on:
  push:
    branches:
      - pnp-proof-obligation-graph-u1-l2-exact-only
    paths:
      - 'research/mathematics/p-vs-np/u1l2c2c1_swap_orbit_weight_quotient_verifier.py'
      - 'protocols/JANUS-PNP-U1L2C2C1-FROZEN-SWAP-ORBIT-WEIGHT-QUOTIENT-PROTOCOL.json'
      - '.github/workflows/validate-u1l2c2c1-swap-orbit-weight-quotient.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exact-swap-orbit-quotient:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile provider
        run: python -m py_compile research/mathematics/p-vs-np/u1l2c2c1_swap_orbit_weight_quotient_verifier.py
      - name: Run exact swap-orbit quotient theorem controls
        run: python research/mathematics/p-vs-np/u1l2c2c1_swap_orbit_weight_quotient_verifier.py
