name: propaganda-defense-guardrails

on:
  push:
    branches:
      - topa-propaganda-defense
    paths:
      - 'PROPAGANDA_DEFENSE.md'
      - 'research/propaganda-defense/**'
      - 'tools/propaganda_defense_check.py'
      - '.github/workflows/propaganda-defense.yml'
  pull_request:
    paths:
      - 'PROPAGANDA_DEFENSE.md'
      - 'research/propaganda-defense/**'
      - 'tools/propaganda_defense_check.py'
      - '.github/workflows/propaganda-defense.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate defensive corpus and firewalls
        run: python tools/propaganda_defense_check.py
