name: Validate Akinator RSPC Tractable Language Sweep

on:
  push:
    paths:
      - 'research/mathematics/p-vs-np/C025_AKINATOR_RSPC_TRACTABLE_LANGUAGE_KILL_SWEEP.md'
      - 'research/mathematics/p-vs-np/akinator_rspc_tractable_language_probe.py'
      - '.github/workflows/validate-akinator-rspc-tractable-language.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finite-mechanics:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tractable-language finite mechanics
        run: python research/mathematics/p-vs-np/akinator_rspc_tractable_language_probe.py
      - name: Claim ceiling reminder
        run: |
          echo 'CI checks finite Horn/Krom/affine closure counterexamples and B2 truth tables only.'
          echo 'The HWB OBDD exponential lower bound is an external theorem.'
          echo 'No impossibility theorem for all tractable representation languages is claimed.'
          echo 'P_VS_NP = OPEN'
