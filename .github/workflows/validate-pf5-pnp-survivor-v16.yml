name: Validate PF5 PNP Spiral Survivor v16
on:
  push:
    branches: [pnp-spiral-hephaestus-crystal-v14]
  workflow_dispatch:
jobs:
  survivor:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact replay
        working-directory: research/mathematics/p-vs-np
        run: python pf5_pnp_spiral_survivor_v16.py --json-out ../../../pf5-pnp-survivor-v16.result.json
      - name: Verify spiral contract
        run: |
          python - <<'PY'
          import json
          d=json.load(open('pf5-pnp-survivor-v16.result.json',encoding='utf-8'))
          assert d['artifact_id']=='PF5-PNP-SPIRAL-SURVIVOR-V16'
          assert d['status']=='FINITE_REPLAY_COMPLETE'
          assert d['seed_order_frozen']==list(range(907000,907016))
          assert d['decision_heuristic'] is False
          assert d['p_vs_np']=='OPEN'
          print('PF5_V16_SPIRAL_CONTRACT = PASS')
          print('SURVIVOR_COUNT =',d['survivor_count'])
          print('FIRST_SURVIVOR =',d['first_survivor']['seed'] if d['first_survivor'] else None)
          if d['first_survivor']:
              print('FIRST_SURVIVOR_CNF =',d['first_survivor']['crystal']['canonical_cnf'])
          print('RESULT_SHA256 =',d['result_sha256'])
          PY
      - name: Claim ceiling
        run: echo 'P_VS_NP = OPEN'
